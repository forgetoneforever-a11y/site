<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0618">
    <title>Ember — Чаты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 0; overflow: hidden; }

        .chat-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 14px 20px;
            background: linear-gradient(180deg, rgba(10,6,24,0.98), rgba(10,6,24,0.85));
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(120, 100, 220, 0.2);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-back {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(30, 20, 60, 0.7);
            border: 1px solid rgba(120, 100, 220, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 18px;
            flex-shrink: 0;
        }
        .chat-back:hover { background: rgba(45, 30, 85, 0.8); }

        .chat-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            flex: 1;
        }

        /* Список чатов */
        .chats-list {
            padding-top: 80px;
            padding-bottom: 20px;
            height: 100vh;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(120, 100, 220, 0.08);
        }
        .chat-item:hover { background: rgba(45, 30, 85, 0.4); }

        .chat-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(217, 56, 94, 0.5);
            flex-shrink: 0;
        }

        .chat-info { flex: 1; min-width: 0; }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .chat-preview {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
            min-width: 22px;
            text-align: center;
        }

        /* Открытый чат */
        .messages {
            position: fixed;
            top: 70px; bottom: 70px;
            left: 0; right: 0;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: msgIn 0.3s;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.me {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.them {
            align-self: flex-start;
            background: rgba(30, 20, 60, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(120, 100, 220, 0.3);
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }

        /* Поле ввода */
        .input-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: rgba(10, 6, 24, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(120, 100, 220, 0.2);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-bar input {
            flex: 1;
            background: rgba(30, 20, 60, 0.7);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            border-radius: 24px;
            padding: 12px 18px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        .input-bar input:focus { border-color: var(--accent); }

        .send-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(123, 47, 255, 0.5);
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .send-btn:active { transform: scale(0.9); }

        .empty-chats {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            color: var(--muted);
            text-align: center;
            padding: 40px;
            gap: 16px;
        }
        .empty-chats-icon { font-size: 60px; opacity: 0.4; }
        .empty-chats-title { font-size: 20px; color: #fff; font-weight: 600; }

        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

    <!-- ВИД 1: Список чатов -->
    <div class="view active" id="view-list">
        <div class="chat-header">
            <div class="chat-back" onclick="goBack()">←</div>
            <div class="chat-title">💬 Чаты</div>
        </div>
        <div class="chats-list" id="chatsList">
            <div class="empty-chats">
                <div class="empty-chats-icon">⏳</div>
                <div>Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- ВИД 2: Открытый чат -->
    <div class="view" id="view-chat">
        <div class="chat-header">
            <div class="chat-back" onclick="closeChat()">←</div>
            <img id="partnerAvatar" class="chat-avatar" style="width:40px;height:40px;" src="images/girl.png" alt="">
            <div class="chat-title" id="partnerName">Чат</div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-bar">
            <input type="text" id="messageInput" placeholder="Сообщение..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_URL = "https://backend-2tcl.onrender.com";
        let myId = null;
        let currentPartner = null;
        let pollInterval = null;

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) return String(user.id);
            }
            let id = localStorage.getItem("emberTgId");
            if (!id) {
                id = "test_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("emberTgId", id);
            }
            return id;
        }

        myId = getTelegramId();
        console.log("👤 Мой ID:", myId);

        // Загрузить список мэтчей + последние сообщения
        async function loadChatsList() {
            try {
                const res = await fetch(API_URL + "/api/matches?telegram_id=" + myId);
                const matches = await res.json();

                // Непрочитанные
                let unread = {};
                try {
                    const unreadRes = await fetch(API_URL + "/api/messages/unread?telegram_id=" + myId);
                    const unreadData = await unreadRes.json();
                    unreadData.forEach(u => unread[u.from_user] = u.count);
                } catch (e) { console.warn("Ошибка unread", e); }

                const list = document.getElementById("chatsList");

                if (!matches || matches.length === 0) {
                    list.innerHTML = `
                        <div class="empty-chats">
                            <div class="empty-chats-icon">💔</div>
                            <div class="empty-chats-title">Пока нет мэтчей</div>
                            <div>Открой Ember и найди кого-то!</div>
                            <button class="match-btn match-btn-primary" onclick="location.href='feed.html'" style="margin-top:16px;max-width:220px;">🔥 Открыть ленту</button>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = matches.map(m => {
                    const badge = unread[m.telegram_id] ? `<div class="chat-badge">${unread[m.telegram_id]}</div>` : "";
                    return `
                        <div class="chat-item" onclick="openChat('${m.telegram_id}', '${m.name}', '${m.age}', '${m.photo || ''}')">
                            <img src="${m.photo || 'images/girl.png'}" class="chat-avatar" onerror="this.src='images/girl.png'">
                            <div class="chat-info">
                                <div class="chat-name">${m.name}, ${m.age}</div>
                                <div class="chat-preview">Нажми, чтобы открыть чат</div>
                            </div>
                            ${badge}
                        </div>
                    `;
                }).join("");
            } catch (e) {
                console.error("Ошибка загрузки:", e);
                document.getElementById("chatsList").innerHTML = `
                    <div class="empty-chats">
                        <div class="empty-chats-icon">⚠️</div>
                        <div>Не удалось загрузить чаты</div>
                    </div>
                `;
            }
        }

        // Открыть чат
        function openChat(partnerId, partnerName, partnerAge, partnerPhoto) {
            currentPartner = { id: partnerId, name: partnerName, age: partnerAge };
            document.getElementById("partnerName").innerText = `${partnerName}, ${partnerAge}`;
            document.getElementById("partnerAvatar").src = partnerPhoto || "images/girl.png";

            document.getElementById("view-list").classList.remove("active");
            document.getElementById("view-chat").classList.add("active");

            loadMessages();

            // Полинг каждые 3 сек
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(loadMessages, 3000);
        }

        // Закрыть чат
        function closeChat() {
            if (pollInterval) clearInterval(pollInterval);
            currentPartner = null;
            document.getElementById("view-chat").classList.remove("active");
            document.getElementById("view-list").classList.add("active");
            loadChatsList();
        }

        // Назад
        function goBack() {
            window.location.href = "feed.html";
        }

        // Загрузить сообщения
        async function loadMessages() {
            if (!currentPartner) return;

            try {
                const res = await fetch(`${API_URL}/api/messages?user1=${myId}&user2=${currentPartner.id}`);
                const messages = await res.json();

                const container = document.getElementById("messages");
                const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;

                container.innerHTML = messages.map(m => {
                    const isMe = String(m.from_user) === String(myId);
                    const time = new Date(m.created_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
                    return `
                        <div class="message ${isMe ? "me" : "them"}">
                            ${escapeHtml(m.text)}
                            <div class="message-time">${time}</div>
                        </div>
                    `;
                }).join("");

                if (wasAtBottom) {
                    container.scrollTop = container.scrollHeight;
                }
            } catch (e) {
                console.error("Ошибка загрузки сообщений:", e);
            }
        }

        // Отправить сообщение
        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text || !currentPartner) return;

            input.value = "";

            // Оптимистичный UI
            const container = document.getElementById("messages");
            const time = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
            container.insertAdjacentHTML("beforeend", `
                <div class="message me">
                    ${escapeHtml(text)}
                    <div class="message-time">${time}</div>
                </div>
            `);
            container.scrollTop = container.scrollHeight;

            try {
                await fetch(API_URL + "/api/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: myId,
                        to_user: currentPartner.id,
                        text: text
                    })
                });
                if (navigator.vibrate) navigator.vibrate(10);
            } catch (e) {
                console.error("Ошибка отправки:", e);
                alert("Не удалось отправить");
            }
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Старт
        loadChatsList();
    </script>
</body>
</html>
