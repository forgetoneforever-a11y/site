<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0618">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Ember — Чаты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }
        html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.2), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.15), transparent 50%),
                #0a0618;
            color: #fff;
        }

        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles span {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: rgba(217, 56, 94, 0.3);
        }
        .bg-particles span:nth-child(1) { left: 10%; top: 20%; }
        .bg-particles span:nth-child(2) { left: 80%; top: 30%; background: rgba(123, 47, 255, 0.4); }
        .bg-particles span:nth-child(3) { left: 30%; top: 70%; }
        .bg-particles span:nth-child(4) { left: 70%; top: 80%; background: rgba(123, 47, 255, 0.4); }
        .bg-particles span:nth-child(5) { left: 50%; top: 15%; }
        .bg-particles span:nth-child(6) { left: 25%; top: 45%; }
        .bg-particles span:nth-child(7) { left: 65%; top: 55%; background: rgba(123, 47, 255, 0.4); }
        .bg-particles span:nth-child(8) { left: 15%; top: 85%; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Шапка */
        .chat-header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 14px 16px;
            background: rgba(10, 6, 24, 0.95);
            border-bottom: 1px solid rgba(120, 100, 220, 0.15);
            z-index: 10; display: flex; align-items: center; gap: 12px; min-height: 66px;
        }

        .chat-back {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.9);
            border: 1px solid rgba(120, 100, 220, 0.35);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }
        .chat-back:hover {
            transform: scale(1.1);
            border-color: rgba(217, 56, 94, 0.7);
        }
        .chat-back svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .chat-title {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px; flex: 1;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .partner-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .partner-info.clickable {
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 12px;
            padding: 4px 6px;
            margin: -4px -6px;
        }
        .partner-info.clickable:hover {
            background: rgba(45, 30, 85, 0.5);
        }
        .partner-info.clickable:active {
            transform: scale(0.98);
        }

        .partner-avatar {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 12px rgba(217, 56, 94, 0.35);
            flex-shrink: 0;
        }
        .partner-name { font-size: 16px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .partner-status { font-size: 12px; color: #4a90e2; margin-top: 2px; }

        /* Список чатов */
        .chats-list {
            padding-top: 80px; padding-bottom: 20px;
            height: 100vh; overflow-y: auto;
            z-index: 1; position: relative;
            contain: layout style paint;
        }

        .chat-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; margin: 0 16px 12px;
            cursor: pointer;
            border: 1.5px solid rgba(120, 100, 220, 0.35);
            border-radius: 20px;
            background: rgba(20, 12, 45, 0.85);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
            position: relative; overflow: hidden;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .chat-item:hover {
            background: rgba(45, 30, 85, 0.85);
            border-color: rgba(217, 56, 94, 0.6);
            transform: translateX(6px) translateZ(0);
        }
        .chat-item:active { transform: translateX(6px) scale(0.98) translateZ(0); }

        .chat-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%; bottom: 20%;
            width: 3px;
            background: linear-gradient(180deg, #ff5c8a, #7b2fff);
            border-radius: 0 3px 3px 0;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .chat-item:hover::before { opacity: 1; }

        .chat-avatar-wrapper { position: relative; flex-shrink: 0; }
        .chat-avatar {
            width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
            border: 2.5px solid rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 15px rgba(217, 56, 94, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .chat-item:hover .chat-avatar {
            transform: scale(1.06) rotate(-3deg);
            box-shadow: 0 0 25px rgba(217, 56, 94, 0.6);
        }

        .online-dot {
            position: absolute; bottom: 2px; right: 2px;
            width: 14px; height: 14px; background: #4ade80; border-radius: 50%;
            border: 2px solid #0a0618;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.7);
        }

        .chat-info { flex: 1; min-width: 0; }
        .chat-name {
            font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-preview { font-size: 13px; color: #9a92c4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-preview.new { color: #ff5c8a; font-weight: 600; }

        .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
        .chat-badge {
            background: linear-gradient(135deg, #d9385e, #a02040);
            color: #fff; border-radius: 14px; padding: 4px 10px;
            font-size: 12px; font-weight: 800; min-width: 26px; text-align: center;
            box-shadow: 0 2px 10px rgba(217, 56, 94, 0.5);
        }

        /* Сообщения */
        .messages {
            position: fixed; top: 70px; bottom: 80px; left: 0; right: 0;
            overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 1;
            contain: layout style paint;
        }

        .message {
            max-width: 78%; padding: 11px 15px;
            border-radius: 18px; font-size: 15px; line-height: 1.45;
            word-wrap: break-word;
            animation: msgIn 0.2s;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 3px 12px rgba(123, 47, 255, 0.35);
        }
        .message.them {
            align-self: flex-start;
            background: rgba(20, 12, 45, 0.9);
            border: 1px solid rgba(120, 100, 220, 0.3);
            color: #fff;
            border-bottom-left-radius: 4px;
        }
        .message-time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }

        /* Поле ввода */
        .input-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: rgba(10, 6, 24, 0.97);
            border-top: 1px solid rgba(120, 100, 220, 0.15);
            display: flex; gap: 10px; align-items: center; z-index: 10;
        }
        .input-bar input {
            flex: 1;
            background: rgba(30, 20, 60, 0.85);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            border-radius: 24px; padding: 13px 18px;
            color: #fff; font-size: 15px;
            font-family: inherit; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-bar input:focus {
            border-color: #d9385e;
            background: rgba(45, 30, 85, 0.9);
            box-shadow: 0 0 15px rgba(217, 56, 94, 0.25);
        }
        .input-bar input::placeholder { color: #5a5580; }

        .send-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 18px rgba(123, 47, 255, 0.5);
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.9); }
        .send-btn svg { width: 20px; height: 20px; fill: #fff; }

        /* Пусто */
        .empty-chats {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 70vh; color: #9a92c4; text-align: center;
            padding: 40px; gap: 16px;
            animation: fadeIn 0.3s;
        }
        .empty-chats-icon { font-size: 70px; opacity: 0.5; }
        .empty-chats-title {
            font-size: 22px; color: #fff; font-weight: 700;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .empty-chats-btn {
            margin-top: 16px; padding: 14px 28px;
            border: none; border-radius: 14px;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; font-size: 15px; font-weight: 600;
            font-family: inherit; cursor: pointer;
            box-shadow: 0 5px 20px rgba(123, 47, 255, 0.45);
            transition: transform 0.2s;
        }
        .empty-chats-btn:hover { transform: translateY(-2px); }

        .view { display: none; }
        .view.active { display: block; }

        .loading-chats {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 20px; gap: 16px; color: #9a92c4;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(120, 100, 220, 0.2);
            border-top-color: #d9385e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ПРОФИЛЬ СОБЕСЕДНИКА */
        .user-profile-overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.2), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.15), transparent 50%),
                #0a0618;
            z-index: 2500; display: none;
            flex-direction: column;
            animation: fadeIn 0.2s;
            overflow-y: auto;
        }
        .user-profile-overlay.active { display: flex; }

        .user-profile-header {
            padding: 14px 16px;
            background: rgba(10, 6, 24, 0.95);
            border-bottom: 1px solid rgba(120, 100, 220, 0.15);
            display: flex; align-items: center; gap: 12px;
            min-height: 66px; flex-shrink: 0;
            position: sticky; top: 0; z-index: 10;
        }

        .user-profile-back {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.9);
            border: 1px solid rgba(120, 100, 220, 0.35);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }
        .user-profile-back:hover {
            transform: scale(1.1);
            border-color: rgba(217, 56, 94, 0.7);
        }
        .user-profile-back svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .user-profile-title {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .user-profile-content {
            padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
            max-width: 500px; margin: 0 auto; width: 100%;
            contain: layout style paint;
        }

        /* Баннер собеседника */
        .user-profile-banner-wrap {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #2a1a4a, #1a1030);
            border: 2px solid rgba(120, 100, 220, 0.3);
            display: none;
            margin-bottom: -90px;
        }
        .user-profile-banner-wrap.visible {
            display: block;
        }
        .user-profile-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .user-profile-avatar-wrap {
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
            position: relative;
            z-index: 2;
        }
        .user-profile-avatar-wrap.with-banner .user-profile-avatar {
            border: 4px solid #0a0618;
            box-shadow: 0 0 0 3px rgba(217, 56, 94, 0.6), 0 0 30px rgba(217, 56, 94, 0.5);
        }

        .user-profile-avatar {
            width: 180px; height: 180px; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 40px rgba(217, 56, 94, 0.4);
        }

        .user-profile-name {
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            color: #fff;
        }
        .user-profile-name span {
            font-size: 22px;
            font-weight: 400;
            color: #c9b8ff;
        }

        .user-profile-city {
            font-size: 15px;
            color: #b8a8ff;
            text-align: center;
            margin-top: -8px;
            font-weight: 500;
            display: none;
        }
        .user-profile-city.visible {
            display: block;
        }

        .user-profile-bio {
            background: rgba(20, 12, 45, 0.85);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            border-radius: 16px;
            padding: 18px;
            font-size: 15px;
            line-height: 1.6;
            color: #e0d5ff;
        }

        .user-profile-actions {
            display: flex; gap: 10px;
        }

        .user-profile-action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .user-profile-action-btn svg { width: 18px; height: 18px; fill: none; }

        .user-profile-action-chat {
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff;
            box-shadow: 0 5px 20px rgba(123, 47, 255, 0.45);
        }
        .user-profile-action-chat:hover { transform: translateY(-2px); }

        .user-profile-action-unmatch {
            background: rgba(217, 56, 94, 0.15);
            color: #ff5c8a;
            border: 1.5px solid rgba(217, 56, 94, 0.5);
        }
        .user-profile-action-unmatch:hover {
            background: rgba(217, 56, 94, 0.3);
        }

        /* GPU-оптимизация */
        .chat-item,
        .chat-back,
        .chat-avatar,
        .partner-avatar,
        .user-profile-avatar,
        .user-profile-banner-wrap {
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .messages,
        .chats-list,
        .user-profile-content {
            contain: layout style paint;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="bg-particles">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- ВИД 1: Список чатов -->
    <div class="view active" id="view-list">
        <div class="chat-header">
            <div class="chat-back" onclick="goBack()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <div class="chat-title">💬 Чаты</div>
        </div>
        <div class="chats-list" id="chatsList">
            <div class="loading-chats">
                <div class="loading-spinner"></div>
                <div>Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- ВИД 2: Открытый чат -->
    <div class="view" id="view-chat">
        <div class="chat-header">
            <div class="chat-back" onclick="closeChat()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <div class="partner-info clickable" onclick="openUserProfile()">
                <img id="partnerAvatar" class="partner-avatar" src="images/girl.png" alt="">
                <div style="min-width:0;">
                    <div class="partner-name" id="partnerName">Чат</div>
                    <div class="partner-status">в сети · тап для профиля</div>
                </div>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-bar">
            <input type="text" id="messageInput" placeholder="Сообщение..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <!-- ПРОФИЛЬ СОБЕСЕДНИКА -->
    <div class="user-profile-overlay" id="userProfileOverlay">
        <div class="user-profile-header">
            <div class="user-profile-back" onclick="closeUserProfile()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <div class="user-profile-title">👤 Профиль</div>
        </div>

        <div class="user-profile-content">
            <!-- Баннер собеседника -->
            <div class="user-profile-banner-wrap" id="upBannerWrap">
                <img id="upBanner" class="user-profile-banner-img" alt="">
            </div>

            <!-- Аватарка -->
            <div class="user-profile-avatar-wrap" id="upAvatarWrap">
                <img id="upAvatar" class="user-profile-avatar" src="images/girl.png" alt="">
                <div class="user-profile-name" id="upName">Имя, <span>возраст</span></div>
                <div class="user-profile-city" id="upCity"></div>
            </div>

            <!-- О себе -->
            <div class="user-profile-bio" id="upBio">
                Нет описания
            </div>

            <!-- Действия -->
            <div class="user-profile-actions">
                <button class="user-profile-action-btn user-profile-action-chat" onclick="closeUserProfile()">
                    <svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    В чат
                </button>
                <button class="user-profile-action-btn user-profile-action-unmatch" onclick="unmatchUser()">
                    <svg viewBox="0 0 24 24" stroke="#ff5c8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                    Размэтчить
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://backend-2tcl.onrender.com";
        let myId = null;
        let currentPartner = null;
        let pollInterval = null;
        let lastMessageId = 0;

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) return String(user.id);
            }
            let id = localStorage.getItem("emberTgId");
            if (!id) {
                id = "test_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("emberTgId", id);
            }
            return id;
        }

        myId = getTelegramId();

        async function loadChatsList() {
            try {
                const res = await fetch(API_URL + "/api/matches?telegram_id=" + myId);
                const matches = await res.json();

                let unread = {};
                try {
                    const unreadRes = await fetch(API_URL + "/api/messages/unread?telegram_id=" + myId);
                    const unreadData = await unreadRes.json();
                    unreadData.forEach(u => unread[u.from_user] = u.count);
                } catch (e) { console.warn("Ошибка unread", e); }

                const list = document.getElementById("chatsList");

                if (!matches || matches.length === 0) {
                    list.innerHTML = `
                        <div class="empty-chats">
                            <div class="empty-chats-icon">💔</div>
                            <div class="empty-chats-title">Пока нет мэтчей</div>
                            <div>Открой Ember и найди кого-то!</div>
                            <button class="empty-chats-btn" onclick="location.href='feed.html'">🔥 Открыть ленту</button>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = matches.map((m) => {
                    const badge = unread[m.telegram_id] ? `<div class="chat-badge">${unread[m.telegram_id]}</div>` : "";
                    const previewClass = unread[m.telegram_id] ? "chat-preview new" : "chat-preview";
                    const previewText = unread[m.telegram_id] ? "Новое сообщение..." : "Нажми, чтобы открыть чат";
                    const bio = (m.bio || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const city = (m.city || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    return `
                        <div class="chat-item"
                             data-banner="${m.banner || ''}"
                             onclick="openChat(
                                '${m.telegram_id}',
                                '${m.name}',
                                '${m.age}',
                                '${m.photo || ''}',
                                '${bio}',
                                '${city}',
                                this.dataset.banner
                             )">
                            <div class="chat-avatar-wrapper">
                                <img src="${m.photo || 'images/girl.png'}" class="chat-avatar" onerror="this.src='images/girl.png'">
                                <div class="online-dot"></div>
                            </div>
                            <div class="chat-info">
                                <div class="chat-name">${m.name}, ${m.age}</div>
                                <div class="${previewClass}">${previewText}</div>
                            </div>
                            <div class="chat-meta">${badge}</div>
                        </div>
                    `;
                }).join("");
            } catch (e) {
                console.error("Ошибка загрузки:", e);
                document.getElementById("chatsList").innerHTML = `
                    <div class="empty-chats">
                        <div class="empty-chats-icon">⚠️</div>
                        <div class="empty-chats-title">Не удалось загрузить</div>
                        <div>Проверь интернет</div>
                    </div>
                `;
            }
        }

        function openChat(partnerId, partnerName, partnerAge, partnerPhoto, partnerBio, partnerCity, partnerBanner) {
            currentPartner = {
                id: partnerId,
                name: partnerName,
                age: partnerAge,
                photo: partnerPhoto,
                bio: partnerBio || "",
                city: partnerCity || "",
                banner: partnerBanner || ""
            };
            lastMessageId = 0;

            document.getElementById("partnerName").innerText = `${partnerName}, ${partnerAge}`;
            document.getElementById("partnerAvatar").src = partnerPhoto || "images/girl.png";

            document.getElementById("view-list").classList.remove("active");
            document.getElementById("view-chat").classList.add("active");
            document.getElementById("messages").innerHTML = "";
            loadMessages(true);

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => loadMessages(false), 3000);
        }

        function closeChat() {
            if (pollInterval) clearInterval(pollInterval);
            currentPartner = null;
            document.getElementById("view-chat").classList.remove("active");
            document.getElementById("view-list").classList.add("active");
            loadChatsList();
        }

        function goBack() {
            window.location.href = "feed.html";
        }

        async function loadMessages(initial = false) {
            if (!currentPartner) return;

            try {
                let messages;

                if (initial) {
                    const res = await fetch(`${API_URL}/api/messages?user1=${myId}&user2=${currentPartner.id}`);
                    messages = await res.json();
                    lastMessageId = 0;
                } else {
                    const res = await fetch(`${API_URL}/api/messages/since?user1=${myId}&user2=${currentPartner.id}&since_id=${lastMessageId}`);
                    messages = await res.json();
                }

                if (!messages || messages.length === 0) return;

                const container = document.getElementById("messages");
                const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;

                if (initial) {
                    container.innerHTML = messages.map(renderMessage).join("");
                } else {
                    messages.forEach(m => {
                        container.insertAdjacentHTML("beforeend", renderMessage(m));
                    });
                }

                if (messages.length > 0) {
                    lastMessageId = messages[messages.length - 1].id;
                }

                if (wasAtBottom || initial) container.scrollTop = container.scrollHeight;
            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        function renderMessage(m) {
            const isMe = String(m.from_user) === String(myId);
            const time = new Date(m.created_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
            return `
                <div class="message ${isMe ? "me" : "them"}">
                    ${escapeHtml(m.text)}
                    <div class="message-time">${time}</div>
                </div>
            `;
        }

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text || !currentPartner) return;
            input.value = "";

            const container = document.getElementById("messages");
            const time = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
            container.insertAdjacentHTML("beforeend", `
                <div class="message me">
                    ${escapeHtml(text)}
                    <div class="message-time">${time}</div>
                </div>
            `);
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch(API_URL + "/api/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ from_user: myId, to_user: currentPartner.id, text })
                });
                const result = await res.json();
                if (result.message?.id) {
                    lastMessageId = Math.max(lastMessageId, result.message.id);
                }
                if (navigator.vibrate) navigator.vibrate(10);
            } catch (e) { console.error("Ошибка:", e); }
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // ПРОФИЛЬ СОБЕСЕДНИКА
        function openUserProfile() {
            if (!currentPartner) return;

            // Баннер
            const bannerWrap = document.getElementById("upBannerWrap");
            const avatarWrap = document.getElementById("upAvatarWrap");

            if (currentPartner.banner && currentPartner.banner.startsWith("data:image")) {
                document.getElementById("upBanner").src = currentPartner.banner;
                bannerWrap.classList.add("visible");
                avatarWrap.classList.add("with-banner");
            } else {
                bannerWrap.classList.remove("visible");
                avatarWrap.classList.remove("with-banner");
            }

            document.getElementById("upAvatar").src = currentPartner.photo || "images/girl.png";
            document.getElementById("upName").innerHTML = `${currentPartner.name}, <span>${currentPartner.age}</span>`;

            const cityEl = document.getElementById("upCity");
            if (currentPartner.city) {
                cityEl.innerText = `📍 ${currentPartner.city}`;
                cityEl.classList.add("visible");
            } else {
                cityEl.classList.remove("visible");
            }

            document.getElementById("upBio").innerText = currentPartner.bio || "Нет описания";

            document.getElementById("userProfileOverlay").classList.add("active");
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function closeUserProfile() {
            document.getElementById("userProfileOverlay").classList.remove("active");
        }

        async function unmatchUser() {
            if (!currentPartner) return;
            if (!confirm(`Размэтчиться с ${currentPartner.name}? Вы больше не сможете общаться.`)) return;

            try {
                await fetch(API_URL + "/api/likes", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: myId,
                        to_user: currentPartner.id
                    })
                });

                if (navigator.vibrate) navigator.vibrate(50);

                closeUserProfile();
                closeChat();
                loadChatsList();
            } catch (e) {
                console.error("Ошибка:", e);
                alert("Не удалось размэтчиться");
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const openId = urlParams.get("open");

        loadChatsList().then(() => {
            if (openId) {
                setTimeout(async () => {
                    try {
                        const res = await fetch(API_URL + "/api/matches?telegram_id=" + myId);
                        const matches = await res.json();
                        const partner = matches.find(m => String(m.telegram_id) === String(openId));
                        if (partner) {
                            openChat(
                                partner.telegram_id,
                                partner.name,
                                partner.age,
                                partner.photo,
                                partner.bio,
                                partner.city,
                                partner.banner
                            );
                        }
                    } catch (e) { console.warn(e); }
                }, 300);
            }
        });
    </script>
</body>
</html>
