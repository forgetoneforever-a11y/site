<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0618">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Ember — Лента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.15), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.12), transparent 50%),
                        #0a0618;
        }

        /* Плавающие частицы на фоне */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-particles span {
            position: absolute;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(217, 56, 94, 0.4);
            animation: floatParticle 15s infinite ease-in-out;
        }

        .bg-particles span:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .bg-particles span:nth-child(2) { left: 80%; top: 30%; animation-delay: 3s; background: rgba(123, 47, 255, 0.5); }
        .bg-particles span:nth-child(3) { left: 30%; top: 70%; animation-delay: 6s; }
        .bg-particles span:nth-child(4) { left: 70%; top: 80%; animation-delay: 9s; background: rgba(123, 47, 255, 0.5); }
        .bg-particles span:nth-child(5) { left: 50%; top: 15%; animation-delay: 12s; }

        @keyframes floatParticle {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(30px, -40px) scale(1.5); opacity: 0.8; }
        }

        .feed-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(10,6,24,0.98), rgba(10,6,24,0.5), transparent);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .feed-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-light), var(--purple), #a855f7);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .feed-menu {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(30, 20, 60, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(120, 100, 220, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .feed-menu:hover {
            transform: scale(1.1);
            background: rgba(45, 30, 85, 0.8);
            border-color: rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.4);
        }

        .feed-menu:active { transform: scale(0.95); }

        .feed-menu svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            transition: stroke 0.2s;
        }

        .feed-menu:hover svg { stroke: var(--accent-light); }

        .cards-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .card {
            position: absolute;
            top: 70px; left: 20px; right: 20px; bottom: 100px;
            background: rgba(30, 20, 60, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 10px 40px rgba(0,0,0,0.5),
                0 0 40px rgba(123, 47, 255, 0.2),
                inset 0 0 0 1px rgba(120, 100, 220, 0.2);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
            animation: cardEnter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cardEnter {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 24px;
            background: linear-gradient(0deg, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent);
            color: #fff;
        }

        .card-name {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .card-age {
            font-size: 22px;
            color: rgba(255,255,255,0.9);
            font-weight: 400;
        }

        .card-bio {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            margin-top: 8px;
            line-height: 1.4;
        }

        .actions {
            position: fixed;
            bottom: 24px; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 10;
        }

        .action-btn {
            width: 68px; height: 68px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .action-btn svg {
            width: 28px;
            height: 28px;
        }

        .action-btn:hover {
            transform: translateY(-4px) scale(1.05);
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .btn-dislike {
            background: rgba(30, 20, 60, 0.8);
            backdrop-filter: blur(20px);
            color: #fff;
            border: 2px solid rgba(120, 100, 220, 0.4);
        }

        .btn-dislike:hover {
            border-color: rgba(120, 100, 220, 0.8);
            box-shadow: 0 8px 30px rgba(120, 100, 220, 0.4);
        }

        .btn-like {
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: #fff;
            box-shadow: 0 8px 30px rgba(123, 47, 255, 0.6), 0 0 60px rgba(217, 56, 94, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-like::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .btn-like:hover::before {
            transform: translateX(100%);
        }

        .btn-like:hover {
            box-shadow: 0 12px 40px rgba(123, 47, 255, 0.8), 0 0 80px rgba(217, 56, 94, 0.6);
        }

        .card.swipe-left {
            transform: translateX(-150%) rotate(-30deg);
            opacity: 0;
        }

        .card.swipe-right {
            transform: translateX(150%) rotate(30deg);
            opacity: 0;
        }

        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            text-align: center;
            padding: 40px;
            font-size: 16px;
            gap: 16px;
            animation: fadeIn 0.5s;
        }

        .empty-icon {
            font-size: 70px;
            opacity: 0.5;
            animation: pulseSlow 2s ease-in-out infinite;
        }

        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .empty-title {
            font-size: 22px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-light), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            font-size: 16px;
        }

        /* ПОПАП МЭТЧ */
        .match-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 6, 24, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.4s;
        }

        .match-overlay.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .match-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.98), rgba(60, 30, 100, 0.95));
            border: 2px solid rgba(217, 56, 94, 0.5);
            border-radius: 32px;
            padding: 36px 28px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.6),
                0 0 80px rgba(217, 56, 94, 0.5),
                0 0 120px rgba(123, 47, 255, 0.4);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        /* Свечение за карточкой */
        .match-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(217, 56, 94, 0.3),
                rgba(123, 47, 255, 0.3),
                transparent
            );
            animation: rotateGlow 6s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .match-card > * {
            position: relative;
            z-index: 1;
        }

        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .match-emoji {
            font-size: 72px;
            margin-bottom: 16px;
            animation: heartBeat 1s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(217, 56, 94, 0.8));
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }

        .match-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-light), var(--purple), #a855f7);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -1px;
            animation: gradientShift 3s ease infinite;
        }

        .match-sub {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .match-photos {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            position: relative;
        }

        .match-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.6);
            transition: transform 0.3s;
        }

        .match-photo:nth-child(1) {
            transform: rotate(-5deg);
            animation: slideInLeft 0.6s 0.2s backwards;
        }

        .match-photo:nth-child(2) {
            transform: rotate(5deg);
            animation: slideInRight 0.6s 0.2s backwards;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100px) rotate(-20deg); opacity: 0; }
            to { transform: translateX(0) rotate(-5deg); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(100px) rotate(20deg); opacity: 0; }
            to { transform: translateX(0) rotate(5deg); opacity: 1; }
        }

        .match-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
        }

        .match-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .match-btn-primary {
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: #fff;
            box-shadow: 0 6px 25px rgba(123, 47, 255, 0.5);
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

        .match-btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .match-btn-primary:hover::before {
            transform: translateX(100%);
        }

        .match-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(123, 47, 255, 0.7);
        }

        .match-btn-secondary {
            background: transparent;
            color: var(--muted);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
        }

        .match-btn-secondary:hover {
            color: #fff;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Бейдж непрочитанных */
        .unread-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            border-radius: 50%;
            min-width: 20px;
            height: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            padding: 0 5px;
            box-shadow: 0 2px 8px rgba(217, 56, 94, 0.6);
            animation: badgePulse 2s ease-in-out infinite;
        }

        .unread-badge.active { display: flex; }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 2px 8px rgba(217, 56, 94, 0.6); }
            50% { box-shadow: 0 2px 20px rgba(217, 56, 94, 1), 0 0 30px rgba(217, 56, 94, 0.5); }
        }
    </style>
</head>
<body>

    <!-- Плавающие частицы -->
    <div class="bg-particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="feed-header">
        <div class="feed-title">Лента</div>
        <div style="display:flex; gap:10px; position:relative;">
            <div class="feed-menu" onclick="window.location.href='chats.html'" title="Чаты">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <div class="unread-badge" id="unreadBadge">0</div>
            </div>
            <div class="feed-menu" onclick="openMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                </svg>
            </div>
        </div>
    </div>

    <div class="cards-container" id="cards">
        <div class="loading">Загрузка анкет...</div>
    </div>

    <div class="actions" id="actions" style="display:none;">
        <button class="action-btn btn-dislike" onclick="swipe('left')">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <button class="action-btn btn-like" onclick="swipe('right')">
            <svg viewBox="0 0 24 24" fill="#fff" stroke="none">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </button>
    </div>

    <div class="match-overlay" id="matchOverlay">
        <div class="match-card">
            <div class="match-emoji">💕</div>
            <div class="match-title">Это мэтч!</div>
            <div class="match-sub">Вы понравились друг другу</div>
            <div class="match-photos">
                <img id="matchPhotoMe" class="match-photo" src="images/girl.png" alt="me">
                <img id="matchPhotoYou" class="match-photo" src="images/girl.png" alt="you">
            </div>
            <div class="match-name" id="matchName"></div>
            <button class="match-btn match-btn-primary" onclick="goToChats()">💬 Написать сообщение</button>
            <button class="match-btn match-btn-secondary" onclick="closeMatch()">Продолжить смотреть</button>
        </div>
    </div>

    <script>
        const API_URL = "https://backend-2tcl.onrender.com";

        let profiles = [];
        let currentIndex = 0;
        let myProfile = null;
        let lastMatchedUser = null;

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) return String(user.id);
            }
            let id = localStorage.getItem("emberTgId");
            if (!id) {
                id = "test_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("emberTgId", id);
            }
            return id;
        }

        function checkAuth() {
            try {
                const saved = localStorage.getItem("emberUser");
                if (!saved) { window.location.href = "index.html"; return null; }
                myProfile = JSON.parse(saved);
                return myProfile;
            } catch (e) {
                window.location.href = "index.html";
                return null;
            }
        }

        async function loadProfiles() {
            const user = checkAuth();
            if (!user) return;

            try {
                const params = new URLSearchParams({
                    telegram_id: getTelegramId(),
                    looking_for: user.lookingFor || "any",
                    min_age: user.minAge || 18,
                    max_age: user.maxAge || 99
                });
                const res = await fetch(API_URL + "/api/recommendations?" + params.toString());
                if (!res.ok) throw new Error("HTTP " + res.status);
                profiles = await res.json();
                renderCard();
            } catch (e) {
                console.error("❌ Ошибка загрузки:", e);
                document.getElementById("cards").innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Не удалось загрузить</div>
                        <div>Проверь интернет или попробуй позже</div>
                    </div>
                `;
            }
        }

        function renderCard() {
            const container = document.getElementById("cards");
            container.innerHTML = "";

            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔥</div>
                        <div class="empty-title">Пока никого нет</div>
                        <div>Заходи позже — появятся новые</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            document.getElementById("actions").style.display = "flex";

            if (currentIndex >= profiles.length) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">✨</div>
                        <div class="empty-title">Анкеты закончились</div>
                        <div>Заходи позже</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            const profile = profiles[currentIndex];
            const card = document.createElement("div");
            card.className = "card";
            const photoSrc = profile.photo || "images/girl.png";
            card.innerHTML = `
                <img src="${photoSrc}" alt="${profile.name}" onerror="this.src='images/girl.png'">
                <div class="card-info">
                    <div class="card-name">${profile.name}, <span class="card-age">${profile.age}</span></div>
                    <div class="card-bio">${profile.bio || ''}</div>
                </div>
            `;
            container.appendChild(card);
        }

        async function swipe(direction) {
            const card = document.querySelector(".card");
            if (!card) return;

            if (navigator.vibrate) navigator.vibrate(20);
            card.classList.add(direction === "left" ? "swipe-left" : "swipe-right");

            const profile = profiles[currentIndex];
            const isLike = direction === "right";

            try {
                const response = await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: profile.telegram_id,
                        is_like: isLike
                    })
                });
                const result = await response.json();

                if (result.isMatch && isLike) {
                    lastMatchedUser = result.matchedUser;
                    setTimeout(() => showMatch(result.matchedUser), 400);
                }
            } catch (e) {
                console.error("❌ Ошибка лайка:", e);
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 400);
        }

        function showMatch(matchedUser) {
            document.getElementById("matchName").innerText = matchedUser.name + ", " + matchedUser.age;
            document.getElementById("matchPhotoYou").src = matchedUser.photo || "images/girl.png";
            document.getElementById("matchPhotoMe").src = myProfile.photo || "images/girl.png";

            const overlay = document.getElementById("matchOverlay");
            overlay.classList.add("active");

            if (navigator.vibrate) navigator.vibrate([50, 100, 50, 100, 50]);
        }

        function closeMatch() {
            document.getElementById("matchOverlay").classList.remove("active");
        }

        function goToChats() {
            closeMatch();
            if (!lastMatchedUser) {
                window.location.href = "chats.html";
                return;
            }
            window.location.href = "chats.html?open=" + lastMatchedUser.telegram_id;
        }

        function openMenu() {
            if (confirm("Сбросить аккаунт и выйти?")) {
                localStorage.removeItem("emberUser");
                localStorage.removeItem("emberRegistered");
                window.location.href = "index.html";
            }
        }

        async function checkUnread() {
            try {
                const res = await fetch(API_URL + "/api/messages/unread?telegram_id=" + getTelegramId());
                const data = await res.json();
                const total = data.reduce((sum, item) => sum + parseInt(item.count), 0);

                const badge = document.getElementById("unreadBadge");
                if (total > 0) {
                    badge.innerText = total > 99 ? "99+" : total;
                    badge.classList.add("active");
                } else {
                    badge.classList.remove("active");
                }
            } catch (e) {
                console.warn("Не удалось получить непрочитанные:", e);
            }
        }

        let startX = 0;
        document.addEventListener("touchstart", e => startX = e.touches[0].clientX);
        document.addEventListener("touchend", e => {
            const diff = e.changedTouches[0].clientX - startX;
            if (diff > 80) swipe("right");
            if (diff < -80) swipe("left");
        });

        loadProfiles();
        checkUnread();
        setInterval(checkUnread, 10000);
    </script>
</body>
</html>
