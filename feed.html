<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0618">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Ember — Лента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 0; overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.25), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.2), transparent 50%),
                #0a0618;
        }

        /* Частицы статичные — без анимации */
        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles span {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: rgba(217, 56, 94, 0.3);
        }
        .bg-particles span:nth-child(1) { left: 10%; top: 20%; }
        .bg-particles span:nth-child(2) { left: 80%; top: 30%; background: rgba(123, 47, 255, 0.4); }
        .bg-particles span:nth-child(3) { left: 30%; top: 70%; }
        .bg-particles span:nth-child(4) { left: 70%; top: 80%; background: rgba(123, 47, 255, 0.4); }
        .bg-particles span:nth-child(5) { left: 50%; top: 15%; }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Шапка */
        .feed-header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(10,6,24,0.98), rgba(10,6,24,0.7), transparent);
            z-index: 10; display: flex; align-items: center; justify-content: space-between;
        }

        .feed-title {
            font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .feed-menu {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.9);
            border: 1px solid rgba(120, 100, 220, 0.35);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .feed-menu:hover {
            transform: scale(1.1);
            border-color: rgba(217, 56, 94, 0.7);
        }
        .feed-menu:active { transform: scale(0.95); }
        .feed-menu svg { width: 20px; height: 20px; stroke: #fff; transition: stroke 0.2s; }
        .feed-menu:hover svg { stroke: #ff5c8a; }

        .profile-btn {
            padding: 0 !important;
            overflow: hidden;
            border: 2px solid rgba(217, 56, 94, 0.6) !important;
            box-shadow: 0 0 12px rgba(217, 56, 94, 0.4) !important;
        }
        .profile-btn img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%; display: block;
        }
        .profile-btn:hover {
            border-color: rgba(217, 56, 94, 1) !important;
            box-shadow: 0 0 18px rgba(217, 56, 94, 0.7) !important;
        }

        .unread-badge {
            position: absolute; top: -4px; right: -4px;
            background: linear-gradient(135deg, #d9385e, #a02040);
            color: #fff; border-radius: 50%; min-width: 20px; height: 20px;
            display: none; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; padding: 0 5px;
            box-shadow: 0 2px 6px rgba(217, 56, 94, 0.5);
        }
        .unread-badge.active { display: flex; }

        /* Лента */
        .cards-container {
            width: 100vw; height: 100vh;
            position: relative; overflow: hidden; z-index: 1;
        }

        .card {
            position: absolute;
            top: 70px; left: 20px; right: 20px; bottom: 100px;
            background: rgba(20, 12, 45, 0.85);
            border: 1px solid rgba(120, 100, 220, 0.3);
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 30px rgba(123, 47, 255, 0.2);
            cursor: grab;
            touch-action: pan-y;
            will-change: transform;
            backface-visibility: hidden;
            transform: translateZ(0);
            animation: cardSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card.dragging {
            transition: none !important;
            cursor: grabbing;
            animation: none;
        }

        .card img {
            width: 100%; height: 100%;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .card-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 24px;
            background: linear-gradient(0deg, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent);
            color: #fff;
            pointer-events: none;
        }
        .card-name { font-size: 26px; font-weight: 700; margin-bottom: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .card-age { font-size: 22px; color: rgba(255,255,255,0.9); font-weight: 400; }
        .card-bio { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 8px; line-height: 1.4; }

        /* Штампы LIKE/NOPE */
        .card-stamp {
            position: absolute;
            top: 40px;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            opacity: 0;
            transform: rotate(-15deg) scale(0.8);
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: opacity 0.15s, transform 0.15s;
        }
        .card-stamp-like {
            left: 30px;
            color: #10b981;
            border: 4px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }
        .card-stamp-nope {
            right: 30px;
            color: #ff5c8a;
            border: 4px solid #ff5c8a;
            transform: rotate(15deg) scale(0.8);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.6);
        }
        .card-stamp-nope.visible {
            transform: rotate(15deg) scale(1);
        }

        .card.swipe-left {
            transform: translateX(-150%) rotate(-30deg);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
        }
        .card.swipe-right {
            transform: translateX(150%) rotate(30deg);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
        }

        /* Кнопки */
        .actions {
            position: fixed; bottom: 24px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 24px; z-index: 10;
        }

        .action-btn {
            width: 68px; height: 68px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .action-btn svg { width: 28px; height: 28px; }
        .action-btn:hover { transform: translateY(-4px) scale(1.05); }
        .action-btn:active { transform: scale(0.92); }

        .btn-dislike {
            background: rgba(30, 20, 60, 0.9);
            color: #fff;
            border: 2px solid rgba(120, 100, 220, 0.4);
        }
        .btn-dislike:hover {
            border-color: rgba(120, 100, 220, 0.8);
            box-shadow: 0 8px 30px rgba(120, 100, 220, 0.4);
        }

        .btn-like {
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff;
            box-shadow: 0 8px 30px rgba(123, 47, 255, 0.6);
        }
        .btn-like:hover {
            box-shadow: 0 12px 40px rgba(123, 47, 255, 0.8);
        }

        /* Пусто */
        .empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: #9a92c4; text-align: center;
            padding: 40px; font-size: 16px; gap: 16px;
        }
        .empty-icon { font-size: 70px; opacity: 0.5; }
        .empty-title {
            font-size: 22px; color: #fff; font-weight: 700;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .loading {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: #9a92c4; font-size: 16px;
        }

        /* МЭТЧ */
        .match-overlay {
            position: fixed; inset: 0;
            background: rgba(10, 6, 24, 0.95);
            z-index: 1000; display: none;
            align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.3s;
        }
        .match-overlay.active { display: flex; }

        .match-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.98), rgba(60, 30, 100, 0.95));
            border: 2px solid rgba(217, 56, 94, 0.5);
            border-radius: 32px; padding: 36px 28px;
            text-align: center; max-width: 360px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 60px rgba(217, 56, 94, 0.4);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .match-emoji {
            font-size: 72px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 15px rgba(217, 56, 94, 0.6));
        }

        .match-title {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 8px; letter-spacing: -1px;
        }
        .match-sub { font-size: 15px; color: #9a92c4; margin-bottom: 24px; }
        .match-photos { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .match-photo {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            border: 3px solid #d9385e;
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.5);
        }
        .match-photo:nth-child(1) { transform: rotate(-5deg); }
        .match-photo:nth-child(2) { transform: rotate(5deg); }

        .match-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 20px; }
        .match-btn {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: transform 0.2s;
        }
        .match-btn-primary {
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff;
            box-shadow: 0 6px 20px rgba(123, 47, 255, 0.5);
            margin-bottom: 10px;
        }
        .match-btn-primary:hover { transform: translateY(-2px); }
        .match-btn-secondary {
            background: transparent; color: #9a92c4;
            border: 1.5px solid rgba(120, 100, 220, 0.3);
        }
        .match-btn-secondary:hover { color: #fff; border-color: #d9385e; }

        /* ═══ ПАНЕЛЬ ЛАЙКОВ ═══ */
        .likes-view {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.2), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.15), transparent 50%),
                #0a0618;
            z-index: 2000; display: none;
            flex-direction: column;
            animation: fadeIn 0.2s;
        }
        .likes-view.active { display: flex; }

        .likes-header {
            padding: 14px 16px;
            background: rgba(10, 6, 24, 0.95);
            border-bottom: 1px solid rgba(120, 100, 220, 0.15);
            display: flex; align-items: center; gap: 12px;
            min-height: 66px; flex-shrink: 0;
        }
        .likes-back {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.9);
            border: 1px solid rgba(120, 100, 220, 0.35);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }
        .likes-back:hover {
            transform: scale(1.1);
            border-color: rgba(217, 56, 94, 0.7);
        }
        .likes-back svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .likes-title {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px; flex: 1;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .likes-tabs {
            display: flex; gap: 8px;
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .likes-tab {
            flex: 1; padding: 12px 16px;
            border-radius: 14px;
            background: rgba(30, 20, 60, 0.75);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            color: #9a92c4; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            text-align: center;
        }
        .likes-tab:hover {
            background: rgba(45, 30, 85, 0.85);
            border-color: rgba(217, 56, 94, 0.5);
        }
        .likes-tab.active {
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; border-color: transparent;
            box-shadow: 0 4px 15px rgba(123, 47, 255, 0.4);
        }
        .likes-tab-count {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border-radius: 10px; padding: 1px 8px;
            font-size: 12px; margin-left: 4px;
        }
        .likes-tab.active .likes-tab-count {
            background: rgba(255,255,255,0.3);
        }

        .likes-content {
            flex: 1; overflow-y: auto;
            padding: 0 16px 20px;
            contain: layout style paint;
        }

        .like-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; margin-bottom: 12px;
            border: 1.5px solid rgba(120, 100, 220, 0.35);
            border-radius: 20px;
            background: rgba(20, 12, 45, 0.85);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .like-avatar {
            width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
            border: 2.5px solid rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 15px rgba(217, 56, 94, 0.4);
            flex-shrink: 0;
        }

        .like-info { flex: 1; min-width: 0; }
        .like-name {
            font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .like-meta {
            font-size: 13px; color: #9a92c4;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .like-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .like-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .like-btn svg { width: 20px; height: 20px; stroke-width: 2.5; fill: none; }

        .like-btn-accept {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .like-btn-accept:hover { transform: scale(1.1); }
        .like-btn-accept svg { stroke: #fff; }

        .like-btn-reject {
            background: rgba(30, 20, 60, 0.85);
            color: #ff5c8a;
            border: 1.5px solid rgba(217, 56, 94, 0.5);
        }
        .like-btn-reject:hover {
            transform: scale(1.1);
            background: rgba(217, 56, 94, 0.2);
            border-color: #d9385e;
        }
        .like-btn-reject svg { stroke: #ff5c8a; }

        .like-btn-cancel {
            background: rgba(217, 56, 94, 0.15);
            color: #ff5c8a;
            border: 1.5px solid rgba(217, 56, 94, 0.5);
        }
        .like-btn-cancel:hover {
            transform: scale(1.1);
            background: rgba(217, 56, 94, 0.3);
        }
        .like-btn-cancel svg { stroke: #ff5c8a; }

        .mutual-badge {
            display: inline-block;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; font-size: 10px; font-weight: 700;
            padding: 2px 8px; border-radius: 8px;
            margin-left: 6px; vertical-align: middle;
        }

        /* ═══ ПРОФИЛЬ ═══ */
        .profile-overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.2), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.15), transparent 50%),
                #0a0618;
            z-index: 2000; display: none;
            flex-direction: column;
            animation: fadeIn 0.2s;
            overflow-y: auto;
        }
        .profile-overlay.active { display: flex; }

        .profile-header-bar {
            padding: 14px 16px;
            background: rgba(10, 6, 24, 0.95);
            border-bottom: 1px solid rgba(120, 100, 220, 0.15);
            display: flex; align-items: center; gap: 12px;
            min-height: 66px; flex-shrink: 0;
            position: sticky; top: 0; z-index: 10;
        }

        .profile-back-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.9);
            border: 1px solid rgba(120, 100, 220, 0.35);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }
        .profile-back-btn:hover {
            transform: scale(1.1);
            border-color: rgba(217, 56, 94, 0.7);
        }
        .profile-back-btn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .profile-title-bar {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .profile-content {
            padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
            max-width: 500px; margin: 0 auto; width: 100%;
        }

        .profile-avatar-section {
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
        }

        .profile-avatar-wrapper {
            position: relative; width: 140px; height: 140px;
        }

        .profile-avatar-img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 30px rgba(217, 56, 94, 0.4);
        }

        .profile-avatar-edit {
            position: absolute; bottom: 4px; right: 4px;
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            border: 3px solid #0a0618;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(123, 47, 255, 0.5);
            transition: transform 0.2s;
        }
        .profile-avatar-edit:hover {
            transform: scale(1.1) rotate(10deg);
        }
        .profile-avatar-edit svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .profile-field {
            display: flex; flex-direction: column; gap: 6px;
        }
        .profile-field label {
            font-size: 11px; color: #9a92c4;
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 600; padding-left: 4px;
        }
        .profile-field input,
        .profile-field textarea {
            width: 100%;
            background: rgba(30, 20, 60, 0.75);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff; font-size: 15px;
            font-family: inherit; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: vertical;
        }
        .profile-field input:focus,
        .profile-field textarea:focus {
            border-color: #d9385e;
            background: rgba(45, 30, 85, 0.85);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.25);
        }
        .profile-field textarea { min-height: 100px; }

        .profile-select {
            width: 100%;
            background: rgba(30, 20, 60, 0.75);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff; font-size: 15px;
            font-family: inherit; outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%239a92c4%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M6%209l6%206%206-6%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 45px;
        }
        .profile-select:focus {
            border-color: #d9385e;
        }
        .profile-select option {
            background: #1a1030; color: #fff;
        }

        .profile-save-btn {
            width: 100%; padding: 16px; border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 6px 20px rgba(123, 47, 255, 0.4);
            transition: transform 0.2s;
        }
        .profile-save-btn:hover { transform: translateY(-2px); }
        .profile-save-btn:active { transform: scale(0.98); }

        .profile-logout-btn {
            width: 100%; padding: 14px;
            border: 1.5px solid rgba(217, 56, 94, 0.4);
            border-radius: 14px;
            background: rgba(217, 56, 94, 0.1);
            color: #ff5c8a; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: background 0.2s, border-color 0.2s;
        }
        .profile-logout-btn:hover {
            background: rgba(217, 56, 94, 0.2);
            border-color: #d9385e;
        }

        .profile-delete-btn {
            width: 100%;
            padding: 14px;
            border: 1.5px solid rgba(217, 56, 94, 0.6);
            border-radius: 14px;
            background: rgba(217, 56, 94, 0.08);
            color: #ff5c8a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .profile-delete-btn:hover {
            background: rgba(217, 56, 94, 0.2);
            border-color: #d9385e;
        }
        .profile-delete-btn:active {
            transform: scale(0.98);
        }
        .profile-delete-btn svg {
            width: 16px;
            height: 16px;
            stroke: #ff5c8a;
            stroke-width: 2.5;
            fill: none;
        }

        .profile-photo-input { display: none; }

        /* ═══ МОДАЛЬНОЕ ОКНО УДАЛЕНИЯ ═══ */
        .delete-modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 6, 24, 0.9);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s;
        }
        .delete-modal.active { display: flex; }
        .delete-modal-card {
            background: linear-gradient(135deg, rgba(40, 15, 30, 0.98), rgba(60, 20, 50, 0.98));
            border: 2px solid rgba(217, 56, 94, 0.7);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 50px rgba(217, 56, 94, 0.4);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .delete-modal-icon {
            font-size: 56px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 15px rgba(217, 56, 94, 0.6));
        }
        .delete-modal-title {
            font-size: 24px; font-weight: 800;
            color: #ff5c8a; margin-bottom: 10px;
        }
        .delete-modal-text {
            font-size: 14px; color: #c9b8ff;
            line-height: 1.5; margin-bottom: 24px;
        }
        .delete-modal-text b { color: #ff5c8a; }
        .delete-modal-btn {
            width: 100%; padding: 14px; border: none;
            border-radius: 14px; font-size: 15px;
            font-weight: 700; cursor: pointer;
            font-family: inherit; transition: transform 0.2s;
            margin-bottom: 10px;
        }
        .delete-modal-btn-danger {
            background: linear-gradient(135deg, #d9385e, #a02040);
            color: #fff;
            box-shadow: 0 6px 20px rgba(217, 56, 94, 0.4);
        }
        .delete-modal-btn-danger:hover {
            transform: translateY(-2px);
        }
        .delete-modal-btn-cancel {
            background: transparent;
            color: #9a92c4;
            border: 1.5px solid rgba(120, 100, 220, 0.3);
        }
        .delete-modal-btn-cancel:hover {
            color: #fff;
            border-color: #7b2fff;
        }

        /* GPU-оптимизация */
        .card,
        .feed-menu,
        .chat-item,
        .like-card,
        .match-photo,
        .like-avatar,
        .avatar {
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .likes-content,
        .profile-content,
        .cards-container {
            contain: layout style paint;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="bg-particles">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="feed-header">
        <div class="feed-title">Лента</div>
        <div style="display:flex; gap:10px; position:relative;">
            <div class="feed-menu" onclick="openLikesView()" title="Лайки">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <div class="unread-badge" id="likesBadge">0</div>
            </div>
            <div class="feed-menu" onclick="window.location.href='chats.html'" title="Чаты">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <div class="unread-badge" id="unreadBadge">0</div>
            </div>
            <div class="feed-menu profile-btn" onclick="openProfile()" title="Профиль">
                <img id="headerAvatar" src="images/girl.png" alt="Profile">
            </div>
        </div>
    </div>

    <div class="cards-container" id="cards">
        <div class="loading">Загрузка анкет...</div>
    </div>

    <div class="actions" id="actions" style="display:none;">
        <button class="action-btn btn-dislike" onclick="swipe('left')">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <button class="action-btn btn-like" onclick="swipe('right')">
            <svg viewBox="0 0 24 24" fill="#fff" stroke="none">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </button>
    </div>

    <div class="match-overlay" id="matchOverlay">
        <div class="match-card">
            <div class="match-emoji">💕</div>
            <div class="match-title">Это мэтч!</div>
            <div class="match-sub">Вы понравились друг другу</div>
            <div class="match-photos">
                <img id="matchPhotoMe" class="match-photo" src="images/girl.png" alt="me">
                <img id="matchPhotoYou" class="match-photo" src="images/girl.png" alt="you">
            </div>
            <div class="match-name" id="matchName"></div>
            <button class="match-btn match-btn-primary" onclick="goToChats()">💬 Написать сообщение</button>
            <button class="match-btn match-btn-secondary" onclick="closeMatch()">Продолжить смотреть</button>
        </div>
    </div>

    <!-- ПАНЕЛЬ ЛАЙКОВ -->
    <div class="likes-view" id="likesView">
        <div class="likes-header">
            <div class="likes-back" onclick="closeLikesView()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <div class="likes-title">❤️ Лайки</div>
        </div>

        <div class="likes-tabs">
            <button class="likes-tab active" onclick="switchLikesTab('incoming')" id="tabIncoming">
                Меня лайкнули<span class="likes-tab-count" id="tabIncomingCount">0</span>
            </button>
            <button class="likes-tab" onclick="switchLikesTab('outgoing')" id="tabOutgoing">
                Я лайкнул<span class="likes-tab-count" id="tabOutgoingCount">0</span>
            </button>
        </div>

        <div class="likes-content" id="likesContent">
            <div class="loading" style="padding: 60px 20px;">Загрузка...</div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div class="profile-overlay" id="profileOverlay">
        <div class="profile-header-bar">
            <div class="profile-back-btn" onclick="closeProfile()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <div class="profile-title-bar">👤 Профиль</div>
        </div>

        <div class="profile-content">
            <div class="profile-avatar-section">
                <div class="profile-avatar-wrapper">
                    <img id="profileAvatarImg" class="profile-avatar-img" src="images/girl.png" alt="Аватар">
                    <div class="profile-avatar-edit" onclick="document.getElementById('profilePhotoInput').click()">
                        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </div>
                </div>
                <input type="file" id="profilePhotoInput" class="profile-photo-input" accept="image/*" onchange="handleProfilePhoto(event)">
            </div>

            <div class="profile-field">
                <label>Имя</label>
                <input type="text" id="profileName" placeholder="Твоё имя" maxlength="32">
            </div>

            <div class="profile-field">
                <label>Никнейм</label>
                <input type="text" id="profileNickname" placeholder="@username">
            </div>

            <div class="profile-field">
                <label>Возраст</label>
                <input type="number" id="profileAge" placeholder="18" min="13" max="99">
            </div>

            <div class="profile-field">
                <label>Пол</label>
                <select id="profileGender" class="profile-select">
                    <option value="male">Парень</option>
                    <option value="female">Девушка</option>
                </select>
            </div>

            <div class="profile-field">
                <label>Кого ищу</label>
                <select id="profileLookingFor" class="profile-select">
                    <option value="male">Парней</option>
                    <option value="female">Девушек</option>
                    <option value="any">Без разницы</option>
                </select>
            </div>

            <div class="profile-field">
                <label>О себе</label>
                <textarea id="profileBio" placeholder="Расскажи о себе..." maxlength="500"></textarea>
            </div>

            <button class="profile-save-btn" onclick="saveProfile()">💾 Сохранить</button>
            <button class="profile-logout-btn" onclick="logout()">🚪 Выйти из аккаунта</button>
            <button class="profile-delete-btn" onclick="openDeleteModal()">
                <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Удалить аккаунт
            </button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО УДАЛЕНИЯ -->
    <div class="delete-modal" id="deleteModal">
        <div class="delete-modal-card">
            <div class="delete-modal-icon">⚠️</div>
            <div class="delete-modal-title">Удалить аккаунт?</div>
            <div class="delete-modal-text">
                Это действие <b>необратимо</b>.<br>
                Все твои лайки, мэтчи и сообщения будут <b>удалены навсегда</b>.
            </div>
            <button class="delete-modal-btn delete-modal-btn-danger" onclick="confirmDeleteAccount()">
                🗑️ Да, удалить навсегда
            </button>
            <button class="delete-modal-btn delete-modal-btn-cancel" onclick="closeDeleteModal()">
                Отмена
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://backend-2tcl.onrender.com";

        let profiles = [];
        let currentIndex = 0;
        let myProfile = null;
        let lastMatchedUser = null;

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) return String(user.id);
            }
            let id = localStorage.getItem("emberTgId");
            if (!id) {
                id = "test_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("emberTgId", id);
            }
            return id;
        }

        function checkAuth() {
            try {
                const saved = localStorage.getItem("emberUser");
                if (!saved) { window.location.href = "index.html"; return null; }
                myProfile = JSON.parse(saved);
                if (myProfile.photo) {
                    document.getElementById("headerAvatar").src = myProfile.photo;
                }
                return myProfile;
            } catch (e) {
                window.location.href = "index.html";
                return null;
            }
        }

        async function loadProfiles() {
            const user = checkAuth();
            if (!user) return;

            try {
                const params = new URLSearchParams({
                    telegram_id: getTelegramId(),
                    looking_for: user.lookingFor || "any",
                    min_age: user.minAge || 13,
                    max_age: user.maxAge || 99
                });
                const res = await fetch(API_URL + "/api/recommendations?" + params.toString());
                if (!res.ok) throw new Error("HTTP " + res.status);
                profiles = await res.json();
                renderCard();
            } catch (e) {
                console.error("❌ Ошибка загрузки:", e);
                document.getElementById("cards").innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Не удалось загрузить</div>
                        <div>Проверь интернет или попробуй позже</div>
                    </div>
                `;
            }
        }

        function renderCard() {
            const container = document.getElementById("cards");
            container.innerHTML = "";

            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔥</div>
                        <div class="empty-title">Пока никого нет</div>
                        <div>Заходи позже — появятся новые</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            document.getElementById("actions").style.display = "flex";

            if (currentIndex >= profiles.length) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">✨</div>
                        <div class="empty-title">Анкеты закончились</div>
                        <div>Заходи позже</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            const profile = profiles[currentIndex];
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.userId = profile.telegram_id;
            const photoSrc = profile.photo || "images/girl.png";
            card.innerHTML = `
                <div class="card-stamp card-stamp-like">LIKE</div>
                <div class="card-stamp card-stamp-nope">NOPE</div>
                <img src="${photoSrc}" alt="${profile.name}" onerror="this.src='images/girl.png'">
                <div class="card-info">
                    <div class="card-name">${profile.name}, <span class="card-age">${profile.age}</span></div>
                    <div class="card-bio">${profile.bio || ''}</div>
                </div>
            `;
            container.appendChild(card);
            initDrag(card);
        }

        async function swipe(direction) {
            const card = document.querySelector(".card");
            if (!card) return;

            if (navigator.vibrate) navigator.vibrate(20);
            card.classList.add(direction === "left" ? "swipe-left" : "swipe-right");

            const profile = profiles[currentIndex];
            const isLike = direction === "right";

            try {
                const response = await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: profile.telegram_id,
                        is_like: isLike
                    })
                });
                const result = await response.json();

                if (result.isMatch && isLike) {
                    lastMatchedUser = result.matchedUser;
                    setTimeout(() => showMatch(result.matchedUser), 400);
                }
            } catch (e) {
                console.error("❌ Ошибка лайка:", e);
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 400);
        }

        function showMatch(matchedUser) {
            document.getElementById("matchName").innerText = matchedUser.name + ", " + matchedUser.age;
            document.getElementById("matchPhotoYou").src = matchedUser.photo || "images/girl.png";
            document.getElementById("matchPhotoMe").src = myProfile.photo || "images/girl.png";

            document.getElementById("matchOverlay").classList.add("active");
            if (navigator.vibrate) navigator.vibrate([50, 100, 50, 100, 50]);
        }

        function closeMatch() {
            document.getElementById("matchOverlay").classList.remove("active");
        }

        function goToChats() {
            closeMatch();
            if (!lastMatchedUser) {
                window.location.href = "chats.html";
                return;
            }
            window.location.href = "chats.html?open=" + lastMatchedUser.telegram_id;
        }

        // ПЛАВНЫЕ СВАЙПЫ
        let dragState = {
            isDragging: false,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            card: null
        };

        function initDrag(card) {
            card.addEventListener("touchstart", onDragStart, { passive: false });
            card.addEventListener("touchmove", onDragMove, { passive: false });
            card.addEventListener("touchend", onDragEnd);
            card.addEventListener("touchcancel", onDragEnd);
            card.addEventListener("mousedown", onDragStart);
        }

        function onDragStart(e) {
            const card = e.currentTarget;
            if (card.classList.contains("swipe-left") || card.classList.contains("swipe-right")) return;

            const touch = e.touches ? e.touches[0] : e;
            dragState.isDragging = true;
            dragState.startX = touch.clientX;
            dragState.startY = touch.clientY;
            dragState.currentX = touch.clientX;
            dragState.currentY = touch.clientY;
            dragState.card = card;
            card.classList.add("dragging");

            if (e.type === "mousedown") {
                document.addEventListener("mousemove", onDragMove);
                document.addEventListener("mouseup", onDragEnd);
            }
        }

        function onDragMove(e) {
            if (!dragState.isDragging || !dragState.card) return;
            if (e.cancelable) e.preventDefault();

            const touch = e.touches ? e.touches[0] : e;
            const deltaX = touch.clientX - dragState.startX;
            const deltaY = touch.clientY - dragState.startY;
            dragState.currentX = touch.clientX;
            dragState.currentY = touch.clientY;

            const rotate = deltaX * 0.08;
            const card = dragState.card;

            card.style.transform = `translate(${deltaX}px, ${deltaY * 0.3}px) rotate(${rotate}deg)`;

            const opacity = Math.max(0.5, 1 - Math.abs(deltaX) / 500);
            card.style.opacity = opacity;

            const likeStamp = card.querySelector(".card-stamp-like");
            const nopeStamp = card.querySelector(".card-stamp-nope");

            if (deltaX > 30) {
                const progress = Math.min(1, (deltaX - 30) / 100);
                likeStamp.style.opacity = progress;
                likeStamp.style.transform = `rotate(-15deg) scale(${0.8 + progress * 0.2})`;
                nopeStamp.style.opacity = 0;
            } else if (deltaX < -30) {
                const progress = Math.min(1, (-deltaX - 30) / 100);
                nopeStamp.style.opacity = progress;
                nopeStamp.style.transform = `rotate(15deg) scale(${0.8 + progress * 0.2})`;
                likeStamp.style.opacity = 0;
            } else {
                likeStamp.style.opacity = 0;
                nopeStamp.style.opacity = 0;
            }
        }

        function onDragEnd() {
            if (!dragState.isDragging || !dragState.card) return;

            const deltaX = dragState.currentX - dragState.startX;
            const card = dragState.card;
            const threshold = 80;

            document.removeEventListener("mousemove", onDragMove);
            document.removeEventListener("mouseup", onDragEnd);

            card.classList.remove("dragging");

            if (deltaX > threshold) {
                card.style.transform = "";
                card.style.opacity = "";
                swipe("right");
            } else if (deltaX < -threshold) {
                card.style.transform = "";
                card.style.opacity = "";
                swipe("left");
            } else {
                card.style.transition = "transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s";
                card.style.transform = "";
                card.style.opacity = "";
                setTimeout(() => {
                    card.style.transition = "";
                }, 400);

                const likeStamp = card.querySelector(".card-stamp-like");
                const nopeStamp = card.querySelector(".card-stamp-nope");
                if (likeStamp) likeStamp.style.opacity = 0;
                if (nopeStamp) nopeStamp.style.opacity = 0;
            }

            dragState.isDragging = false;
            dragState.card = null;
        }

        // ПАНЕЛЬ ЛАЙКОВ
        function openLikesView() {
            document.getElementById("likesView").classList.add("active");
            loadLikes("incoming");
            switchLikesTab("incoming");
        }

        function closeLikesView() {
            document.getElementById("likesView").classList.remove("active");
        }

        function switchLikesTab(tab) {
            document.getElementById("tabIncoming").classList.toggle("active", tab === "incoming");
            document.getElementById("tabOutgoing").classList.toggle("active", tab === "outgoing");
            loadLikes(tab);
        }

        async function loadLikes(tab) {
            const content = document.getElementById("likesContent");
            content.innerHTML = '<div class="loading" style="padding: 60px 20px;">Загрузка...</div>';

            try {
                const endpoint = tab === "incoming" ? "/api/likes/incoming" : "/api/likes/outgoing";
                const res = await fetch(API_URL + endpoint + "?telegram_id=" + getTelegramId());
                const data = await res.json();

                if (tab === "incoming") {
                    document.getElementById("tabIncomingCount").innerText = data.length;
                } else {
                    document.getElementById("tabOutgoingCount").innerText = data.length;
                }

                if (!data || data.length === 0) {
                    content.innerHTML = `
                        <div class="empty" style="padding-top: 80px;">
                            <div class="empty-icon">${tab === "incoming" ? "💔" : "💜"}</div>
                            <div class="empty-title">${tab === "incoming" ? "Никто не лайкнул" : "Ты никого не лайкнул"}</div>
                            <div>${tab === "incoming" ? "Продолжай свайпать в ленте" : "Листай анкеты в ленте"}</div>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = data.map((u) => {
                    if (tab === "incoming") {
                        return `
                            <div class="like-card">
                                <img src="${u.photo || 'images/girl.png'}" class="like-avatar" onerror="this.src='images/girl.png'">
                                <div class="like-info">
                                    <div class="like-name">${u.name}, ${u.age}</div>
                                    <div class="like-meta">${u.bio ? u.bio.slice(0, 40) + (u.bio.length > 40 ? '...' : '') : 'Хочет познакомиться'}</div>
                                </div>
                                <div class="like-actions">
                                    <button class="like-btn like-btn-reject" onclick="rejectIncoming('${u.telegram_id}', this)">
                                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
                                    </button>
                                    <button class="like-btn like-btn-accept" onclick="acceptIncoming('${u.telegram_id}', this)">
                                        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        const mutual = u.is_mutual ? '<span class="mutual-badge">💕 МЭТЧ</span>' : '';
                        return `
                            <div class="like-card">
                                <img src="${u.photo || 'images/girl.png'}" class="like-avatar" onerror="this.src='images/girl.png'">
                                <div class="like-info">
                                    <div class="like-name">${u.name}, ${u.age}${mutual}</div>
                                    <div class="like-meta">${u.bio ? u.bio.slice(0, 40) + (u.bio.length > 40 ? '...' : '') : 'Ты лайкнул эту анкету'}</div>
                                </div>
                                <div class="like-actions">
                                    <button class="like-btn like-btn-cancel" onclick="cancelOutgoing('${u.telegram_id}', this)" title="Отменить лайк">
                                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }).join("");
            } catch (e) {
                console.error("Ошибка загрузки лайков:", e);
                content.innerHTML = `
                    <div class="empty" style="padding-top: 80px;">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Не удалось загрузить</div>
                        <div>Проверь интернет</div>
                    </div>
                `;
            }
        }

        async function acceptIncoming(userId, btn) {
            if (navigator.vibrate) navigator.vibrate(30);
            btn.style.transform = "scale(0.9)";

            try {
                const res = await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId,
                        is_like: true
                    })
                });
                const result = await res.json();

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);

                if (result.isMatch) {
                    lastMatchedUser = result.matchedUser;
                    setTimeout(() => {
                        closeLikesView();
                        showMatch(result.matchedUser);
                    }, 400);
                }
            } catch (e) {
                console.error("Ошибка:", e);
                alert("Не удалось принять лайк");
            }
        }

        async function rejectIncoming(userId, btn) {
            if (navigator.vibrate) navigator.vibrate(10);
            btn.style.transform = "scale(0.9)";

            try {
                await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId,
                        is_like: false
                    })
                });

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(-100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        async function cancelOutgoing(userId, btn) {
            if (!confirm("Отменить лайк?")) return;
            if (navigator.vibrate) navigator.vibrate(10);
            btn.style.transform = "scale(0.9)";

            try {
                await fetch(API_URL + "/api/likes", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId
                    })
                });

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(-100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        // ПРОФИЛЬ
        let profileData = null;

        async function openProfile() {
            document.getElementById("profileOverlay").classList.add("active");
            await loadProfileData();
        }

        function closeProfile() {
            document.getElementById("profileOverlay").classList.remove("active");
        }

        async function loadProfileData() {
            try {
                const res = await fetch(API_URL + "/api/profile?telegram_id=" + getTelegramId());
                if (!res.ok) throw new Error("HTTP " + res.status);
                profileData = await res.json();

                document.getElementById("profileName").value = profileData.name || "";
                document.getElementById("profileNickname").value = profileData.nickname || "";
                document.getElementById("profileAge").value = profileData.age || "";
                document.getElementById("profileGender").value = profileData.gender || "male";
                document.getElementById("profileLookingFor").value = profileData.looking_for || "any";
                document.getElementById("profileBio").value = profileData.bio || "";
                document.getElementById("profileAvatarImg").src = profileData.photo || "images/girl.png";
                document.getElementById("headerAvatar").src = profileData.photo || "images/girl.png";
            } catch (e) {
                console.error("Ошибка загрузки профиля:", e);
                if (myProfile) {
                    document.getElementById("profileName").value = myProfile.name || "";
                    document.getElementById("profileAge").value = myProfile.age || "";
                    document.getElementById("profileAvatarImg").src = myProfile.photo || "images/girl.png";
                }
            }
        }

        function handleProfilePhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("Файл слишком большой (макс 5 МБ)");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById("profileAvatarImg").src = e.target.result;
                if (!profileData) profileData = {};
                profileData.photo = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function saveProfile() {
            const name = document.getElementById("profileName").value.trim();
            const age = parseInt(document.getElementById("profileAge").value);

            if (name.length < 2) {
                alert("Имя должно быть от 2 символов");
                return;
            }
            if (!age || age < 13) {
                alert("Минимальный возраст — 13 лет");
                return;
            }

            const data = {
                telegram_id: getTelegramId(),
                name: name,
                nickname: document.getElementById("profileNickname").value.trim() || null,
                age: age,
                gender: document.getElementById("profileGender").value,
                looking_for: document.getElementById("profileLookingFor").value,
                bio: document.getElementById("profileBio").value.trim() || null,
                photo: profileData?.photo || null
            };

            try {
                const res = await fetch(API_URL + "/api/profile", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.ok) {
                    const localData = JSON.parse(localStorage.getItem("emberUser") || "{}");
                    localData.name = data.name;
                    localData.age = data.age;
                    localData.nickname = data.nickname;
                    localData.bio = data.bio;
                    if (data.photo) localData.photo = data.photo;
                    localStorage.setItem("emberUser", JSON.stringify(localData));

                    if (data.photo) {
                        document.getElementById("headerAvatar").src = data.photo;
                    }

                    if (navigator.vibrate) navigator.vibrate(30);

                    const btn = document.querySelector(".profile-save-btn");
                    const originalText = btn.innerText;
                    btn.innerText = "✅ Сохранено";
                    setTimeout(() => { btn.innerText = originalText; }, 1500);
                } else {
                    alert("Ошибка: " + (result.error || "не удалось сохранить"));
                }
            } catch (e) {
                console.error("Ошибка сохранения:", e);
                alert("Не удалось сохранить профиль");
            }
        }

        function logout() {
            if (confirm("Выйти из аккаунта? Анкета удалится из Ember.")) {
                localStorage.removeItem("emberUser");
                localStorage.removeItem("emberRegistered");
                localStorage.removeItem("emberTgId");
                window.location.href = "index.html";
            }
        }

        // УДАЛЕНИЕ АККАУНТА
        function openDeleteModal() {
            document.getElementById("deleteModal").classList.add("active");
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function closeDeleteModal() {
            document.getElementById("deleteModal").classList.remove("active");
        }

        async function confirmDeleteAccount() {
            const btn = document.querySelector(".delete-modal-btn-danger");
            btn.innerText = "⏳ Удаляем...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL + "/api/profile", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ telegram_id: getTelegramId() })
                });
                const result = await res.json();

                if (result.ok) {
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                    localStorage.removeItem("emberUser");
                    localStorage.removeItem("emberRegistered");
                    localStorage.removeItem("emberTgId");

                    btn.innerText = "✅ Удалено";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 800);
                } else {
                    alert("Ошибка: " + (result.error || "не удалось удалить"));
                    btn.innerText = "🗑️ Да, удалить навсегда";
                    btn.disabled = false;
                }
            } catch (e) {
                console.error("Ошибка удаления:", e);
                alert("Не удалось удалить аккаунт. Проверь интернет.");
                btn.innerText = "🗑️ Да, удалить навсегда";
                btn.disabled = false;
            }
        }

        document.getElementById("deleteModal")?.addEventListener("click", (e) => {
            if (e.target.id === "deleteModal") closeDeleteModal();
        });

        // БЕЙДЖИ — только когда окно активно
        let isActive = true;
        document.addEventListener("visibilitychange", () => {
            isActive = !document.hidden;
            if (isActive) checkBadges();
        });

        async function checkBadges() {
            try {
                const res = await fetch(API_URL + "/api/likes/incoming?telegram_id=" + getTelegramId());
                const likesData = await res.json();
                const likesBadge = document.getElementById("likesBadge");
                if (likesData.length > 0) {
                    likesBadge.innerText = likesData.length > 99 ? "99+" : likesData.length;
                    likesBadge.classList.add("active");
                } else {
                    likesBadge.classList.remove("active");
                }
            } catch (e) {}

            try {
                const res = await fetch(API_URL + "/api/messages/unread?telegram_id=" + getTelegramId());
                const data = await res.json();
                const total = data.reduce((sum, item) => sum + parseInt(item.count), 0);
                const badge = document.getElementById("unreadBadge");
                if (total > 0) {
                    badge.innerText = total > 99 ? "99+" : total;
                    badge.classList.add("active");
                } else {
                    badge.classList.remove("active");
                }
            } catch (e) {}
        }

        loadProfiles();
        checkBadges();
        setInterval(() => {
            if (isActive) checkBadges();
        }, 20000);
    </script>
