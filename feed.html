<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Ember — Лента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 0; overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.06), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(180, 180, 180, 0.05), transparent 60%),
                linear-gradient(135deg, #000000 0%, #0d0d0d 50%, #000000 100%);
            background-attachment: fixed;
        }

        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles span {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }
        .bg-particles span:nth-child(1) { left: 10%; top: 20%; }
        .bg-particles span:nth-child(2) { left: 80%; top: 30%; background: rgba(255, 255, 255, 0.3); }
        .bg-particles span:nth-child(3) { left: 30%; top: 70%; }
        .bg-particles span:nth-child(4) { left: 70%; top: 80%; background: rgba(255, 255, 255, 0.3); }
        .bg-particles span:nth-child(5) { left: 50%; top: 15%; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @keyframes chromeShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .feed-header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.98), rgba(0,0,0,0.7), transparent);
            z-index: 10; display: flex; align-items: center; justify-content: space-between;
        }

        .feed-title {
            font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0, #ffffff, #808080);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: chromeShift 4s ease infinite;
        }

        .feed-menu {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .feed-menu:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .feed-menu:active { transform: scale(0.95); }
        .feed-menu svg { width: 20px; height: 20px; stroke: #fff; transition: stroke 0.2s; }
        .feed-menu:hover svg { stroke: #ccc; }

        .profile-btn {
            padding: 0 !important;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.2) !important;
        }
        .profile-btn img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%; display: block;
        }

        .unread-badge {
            position: absolute; top: -4px; right: -4px;
            background: linear-gradient(135deg, #ffffff, #808080);
            color: #000; border-radius: 50%; min-width: 20px; height: 20px;
            display: none; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; padding: 0 5px;
            box-shadow: 0 2px 6px rgba(255, 255, 255, 0.3);
        }
        .unread-badge.active { display: flex; }

        .cards-container {
            width: 100vw; height: 100vh;
            position: relative; overflow: hidden; z-index: 1;
        }

        .card {
            position: absolute;
            top: 70px; left: 20px; right: 20px; bottom: 100px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 30px rgba(255, 255, 255, 0.08);
            cursor: grab;
            touch-action: pan-y;
            will-change: transform;
            backface-visibility: hidden;
            transform: translateZ(0);
            animation: cardSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card.dragging {
            transition: none !important;
            cursor: grabbing;
            animation: none;
        }

        .card img {
            width: 100%; height: 100%;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .card-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 24px;
            background: linear-gradient(0deg, rgba(0,0,0,0.98), rgba(0,0,0,0.7), transparent);
            color: #fff;
            pointer-events: none;
        }
        .card-name { font-size: 26px; font-weight: 700; margin-bottom: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .card-age { font-size: 22px; color: rgba(255,255,255,0.9); font-weight: 400; }

        .card-city {
            font-size: 13px;
            color: #b0b0b0;
            margin-top: 4px;
            font-weight: 500;
        }

        .card-bio { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 8px; line-height: 1.4; }

        .card-stats {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .card-stat-like {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .card-stat-dislike {
            color: #b0b0b0;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-stamp {
            position: absolute;
            top: 40px;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            opacity: 0;
            transform: rotate(0deg) scale(0.8);
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: opacity 0.15s, transform 0.15s;
        }
        .card-stamp-like {
            right: 30px;
            color: #ffffff;
            border: 4px solid #ffffff;
            transform: rotate(15deg) scale(0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }
        .card-stamp-nope {
            left: 30px;
            color: #808080;
            border: 4px solid #808080;
            transform: rotate(-15deg) scale(0.8);
            box-shadow: 0 0 20px rgba(128, 128, 128, 0.6);
        }

        .card.swipe-left {
            transform: translateX(-150%) rotate(-30deg);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
        }
        .card.swipe-right {
            transform: translateX(150%) rotate(30deg);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
        }

        .actions {
            position: fixed; bottom: 24px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center;
            gap: 18px; z-index: 10;
            padding: 0 20px;
        }

        .action-btn {
            width: 68px; height: 68px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .action-btn:hover { transform: translateY(-4px) scale(1.05); }
        .action-btn:active { transform: scale(0.92); }

        .btn-refresh {
            position: absolute;
            left: 20px;
            width: 46px;
            height: 46px;
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .btn-refresh svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-refresh:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        .btn-refresh.spinning svg {
            transform: rotate(360deg);
        }

        .btn-like {
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .btn-like:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.15);
        }
        .btn-like svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            transition: stroke 0.2s;
        }
        .btn-like:hover svg {
            stroke: #ccc;
        }

        .btn-dislike {
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .btn-dislike:hover {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.15);
        }
        .btn-dislike svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            transition: stroke 0.2s;
        }
        .btn-dislike:hover svg {
            stroke: #ccc;
        }

        .empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: #808080; text-align: center;
            padding: 40px; font-size: 16px; gap: 16px;
        }
        .empty-icon { font-size: 70px; opacity: 0.5; }
        .empty-title {
            font-size: 22px; color: #fff; font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #808080);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .loading {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: #808080; font-size: 16px;
        }

        .match-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000; display: none;
            align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.3s;
        }
        .match-overlay.active { display: flex; }

        .match-card {
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.98), rgba(40, 40, 40, 0.95));
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px; padding: 36px 28px;
            text-align: center; max-width: 360px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 60px rgba(255, 255, 255, 0.15);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .match-emoji {
            font-size: 72px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        .match-title {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 8px; letter-spacing: -1px;
        }
        .match-sub { font-size: 15px; color: #808080; margin-bottom: 24px; }
        .match-photos { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .match-photo {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
        .match-photo:nth-child(1) { transform: rotate(-5deg); }
        .match-photo:nth-child(2) { transform: rotate(5deg); }

        .match-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 20px; }
        .match-btn {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: transform 0.2s;
        }
        .match-btn-primary {
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            color: #000;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            margin-bottom: 10px;
        }
        .match-btn-primary:hover { transform: translateY(-2px); }
        .match-btn-secondary {
            background: transparent; color: #808080;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
        }
        .match-btn-secondary:hover { color: #fff; border-color: #fff; }

        .likes-view {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.06), transparent 50%),
                linear-gradient(135deg, #000000 0%, #0d0d0d 50%, #000000 100%);
            z-index: 2000; display: none;
            flex-direction: column;
            animation: fadeIn 0.2s;
        }
        .likes-view.active { display: flex; }

        .likes-header {
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 12px;
            min-height: 66px; flex-shrink: 0;
        }
        .likes-back {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }
        .likes-back:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .likes-back svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .likes-title {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px; flex: 1;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .likes-tabs {
            display: flex; gap: 8px;
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .likes-tab {
            flex: 1; padding: 12px 16px;
            border-radius: 14px;
            background: rgba(20, 20, 20, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #808080; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            text-align: center;
        }
        .likes-tab:hover {
            background: rgba(35, 35, 35, 0.85);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .likes-tab.active {
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            color: #000; border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
        }
        .likes-tab-count {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border-radius: 10px; padding: 1px 8px;
            font-size: 12px; margin-left: 4px;
        }
        .likes-tab.active .likes-tab-count {
            background: rgba(0,0,0,0.15);
        }

        .likes-content {
            flex: 1; overflow-y: auto;
            padding: 0 16px 20px;
            contain: layout style paint;
        }

        .like-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; margin-bottom: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            background: rgba(20, 20, 20, 0.85);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .like-avatar {
            width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }

        .like-info { flex: 1; min-width: 0; }
        .like-name {
            font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .like-meta {
            font-size: 13px; color: #808080;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .like-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .like-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .like-btn svg { width: 20px; height: 20px; stroke-width: 2.5; fill: none; }

        .like-btn-accept {
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }
        .like-btn-accept:hover { transform: scale(1.1); }
        .like-btn-accept svg { stroke: #000; }

        .like-btn-reject {
            background: rgba(20, 20, 20, 0.85);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
        }
        .like-btn-reject:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }
        .like-btn-reject svg { stroke: #fff; }

        .like-btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.3);
        }
        .like-btn-cancel:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.15);
        }
        .like-btn-cancel svg { stroke: #fff; }

        .mutual-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffffff, #808080);
            color: #000; font-size: 10px; font-weight: 700;
            padding: 2px 8px; border-radius: 8px;
            margin-left: 6px; vertical-align: middle;
        }

        .profile-overlay {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.06), transparent 50%),
                linear-gradient(135deg, #000000 0%, #0d0d0d 50%, #000000 100%);
            z-index: 2000; display: none;
            flex-direction: column;
            animation: fadeIn 0.2s;
            overflow-y: auto;
        }
        .profile-overlay.active { display: flex; }

        .profile-header-bar {
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 12px;
            min-height: 66px; flex-shrink: 0;
            position: sticky; top: 0; z-index: 10;
        }

        .profile-back-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: transform 0.2s, border-color 0.2s;
        }
        .profile-back-btn:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .profile-back-btn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .profile-title-bar {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .profile-content {
            padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
            max-width: 500px; margin: 0 auto; width: 100%;
            contain: layout style paint;
        }

        .profile-banner-wrap {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .profile-banner-wrap:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .profile-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-banner-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #808080;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            padding: 20px;
        }
        .profile-banner-placeholder svg {
            width: 32px;
            height: 32px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
        }

        .profile-banner-edit {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
        }
        .profile-banner-edit svg {
            width: 16px; height: 16px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
        }

        .profile-banner-file { display: none; }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .profile-stat {
            background: rgba(20, 20, 20, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .profile-stat-value {

    <script>
        const API_URL = "https://backend-2tcl.onrender.com";

        let profiles = [];
        let currentIndex = 0;
        let myProfile = null;
        let lastMatchedUser = null;

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) return String(user.id);
            }
            let id = localStorage.getItem("emberTgId");
            if (!id) {
                id = "test_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("emberTgId", id);
            }
            return id;
        }

        function checkAuth() {
            try {
                const saved = localStorage.getItem("emberUser");
                if (!saved) { window.location.href = "index.html"; return null; }
                myProfile = JSON.parse(saved);
                if (myProfile.photo) {
                    document.getElementById("headerAvatar").src = myProfile.photo;
                }
                return myProfile;
            } catch (e) {
                window.location.href = "index.html";
                return null;
            }
        }

        async function loadProfiles(retryCount = 0) {
            const user = checkAuth();
            if (!user) return 0;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);

            try {
                const params = new URLSearchParams({
                    telegram_id: getTelegramId(),
                    looking_for: user.lookingFor || "any",
                    min_age: user.minAge || 13,
                    max_age: user.maxAge || 99,
                    _t: Date.now()
                });
                const res = await fetch(API_URL + "/api/recommendations?" + params.toString(), {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error("HTTP " + res.status);
                profiles = await res.json();
                currentIndex = 0;
                renderCard();
                return profiles.length;
            } catch (e) {
                clearTimeout(timeoutId);
                console.error("❌ Ошибка загрузки:", e);

                if (retryCount < 1) {
                    console.log("🔄 Повторная попытка через 3 сек...");
                    document.getElementById("cards").innerHTML = `
                        <div class="loading">
                            <div style="text-align:center;">
                                <div style="font-size:48px;margin-bottom:12px;">⏳</div>
                                <div>Сервер просыпается...</div>
                            </div>
                        </div>
                    `;
                    await new Promise(r => setTimeout(r, 3000));
                    return loadProfiles(retryCount + 1);
                }

                document.getElementById("cards").innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⏳</div>
                        <div class="empty-title">Сервер просыпается</div>
                        <div>Подожди 20 секунд и нажми 🔄 внизу</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "flex";
                return 0;
            }
        }

        async function refreshProfiles() {
            if (navigator.vibrate) navigator.vibrate(15);

            const btn = document.querySelector(".btn-refresh");
            if (btn) btn.classList.add("spinning");
            setTimeout(() => {
                if (btn) btn.classList.remove("spinning");
            }, 700);

            const container = document.getElementById("cards");
            container.innerHTML = `
                <div class="loading">
                    <div style="text-align:center;">
                        <div style="font-size:48px;margin-bottom:12px;">⏳</div>
                        <div>Обновляем анкеты...</div>
                    </div>
                </div>
            `;
            document.getElementById("actions").style.display = "flex";

            const count = await loadProfiles();

            if (count === 0) {
                const container = document.getElementById("cards");
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">Новых анкет нет</div>
                        <div>Заходи позже — появятся новые</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "flex";
            }
        }

        function renderCard() {
            const container = document.getElementById("cards");
            container.innerHTML = "";

            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔥</div>
                        <div class="empty-title">Пока никого нет</div>
                        <div>Обнови анкеты кнопкой ниже</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "flex";
                return;
            }

            document.getElementById("actions").style.display = "flex";

            if (currentIndex >= profiles.length) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">✨</div>
                        <div class="empty-title">Анкеты закончились</div>
                        <div>Обнови анкеты кнопкой ниже</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "flex";
                return;
            }

            const profile = profiles[currentIndex];
            const card = document.createElement("div");
            card.className = "card";
            card.dataset.userId = profile.telegram_id;
            const photoSrc = profile.photo || "images/girl.png";
            const cityText = profile.city ? `📍 ${profile.city}` : '';
            const likesCount = profile.likes_received || 0;
            const dislikesCount = profile.dislikes_received || 0;

            card.innerHTML = `
                <div class="card-stamp card-stamp-nope">NOPE</div>
                <div class="card-stamp card-stamp-like">LIKE</div>
                <img src="${photoSrc}" alt="${profile.name}" onerror="this.src='images/girl.png'">
                <div class="card-info">
                    <div class="card-name">${profile.name}, <span class="card-age">${profile.age}</span></div>
                    ${cityText ? `<div class="card-city">${cityText}</div>` : ''}
                    <div class="card-bio">${profile.bio || ''}</div>
                    <div class="card-stats">
                        <span class="card-stat-like">❤️ ${likesCount}</span>
                        <span class="card-stat-dislike">👎 ${dislikesCount}</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
            initDrag(card);
        }

        async function swipe(direction) {
            const card = document.querySelector(".card");
            if (!card) return;

            if (navigator.vibrate) navigator.vibrate(20);
            card.classList.add(direction === "left" ? "swipe-left" : "swipe-right");

            const profile = profiles[currentIndex];
            const isLike = direction === "left";

            try {
                const response = await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: profile.telegram_id,
                        is_like: isLike
                    })
                });
                const result = await response.json();

                if (result.isMatch && isLike) {
                    lastMatchedUser = result.matchedUser;
                    setTimeout(() => showMatch(result.matchedUser), 400);
                }
            } catch (e) {
                console.error("❌ Ошибка лайка:", e);
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 400);
        }

        function showMatch(matchedUser) {
            document.getElementById("matchName").innerText = matchedUser.name + ", " + matchedUser.age;
            document.getElementById("matchPhotoYou").src = matchedUser.photo || "images/girl.png";
            document.getElementById("matchPhotoMe").src = myProfile.photo || "images/girl.png";

            document.getElementById("matchOverlay").classList.add("active");
            if (navigator.vibrate) navigator.vibrate([50, 100, 50, 100, 50]);
        }

        function closeMatch() {
            document.getElementById("matchOverlay").classList.remove("active");
        }

        function goToChats() {
            closeMatch();
            if (!lastMatchedUser) {
                window.location.href = "chats.html";
                return;
            }
            window.location.href = "chats.html?open=" + lastMatchedUser.telegram_id;
        }

        let dragState = {
            isDragging: false,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            card: null
        };

        function initDrag(card) {
            card.addEventListener("touchstart", onDragStart, { passive: false });
            card.addEventListener("touchmove", onDragMove, { passive: false });
            card.addEventListener("touchend", onDragEnd);
            card.addEventListener("touchcancel", onDragEnd);
            card.addEventListener("mousedown", onDragStart);
        }

        function onDragStart(e) {
            const card = e.currentTarget;
            if (card.classList.contains("swipe-left") || card.classList.contains("swipe-right")) return;

            const touch = e.touches ? e.touches[0] : e;
            dragState.isDragging = true;
            dragState.startX = touch.clientX;
            dragState.startY = touch.clientY;
            dragState.currentX = touch.clientX;
            dragState.currentY = touch.clientY;
            dragState.card = card;
            card.classList.add("dragging");

            if (e.type === "mousedown") {
                document.addEventListener("mousemove", onDragMove);
                document.addEventListener("mouseup", onDragEnd);
            }
        }

        function onDragMove(e) {
            if (!dragState.isDragging || !dragState.card) return;
            if (e.cancelable) e.preventDefault();

            const touch = e.touches ? e.touches[0] : e;
            const deltaX = touch.clientX - dragState.startX;
            const deltaY = touch.clientY - dragState.startY;
            dragState.currentX = touch.clientX;
            dragState.currentY = touch.clientY;

            const rotate = deltaX * 0.08;
            const card = dragState.card;

            card.style.transform = `translate(${deltaX}px, ${deltaY * 0.3}px) rotate(${rotate}deg)`;

            const opacity = Math.max(0.5, 1 - Math.abs(deltaX) / 500);
            card.style.opacity = opacity;

            const likeStamp = card.querySelector(".card-stamp-like");
            const nopeStamp = card.querySelector(".card-stamp-nope");

            if (deltaX > 30) {
                const progress = Math.min(1, (deltaX - 30) / 100);
                nopeStamp.style.opacity = progress;
                nopeStamp.style.transform = `rotate(-15deg) scale(${0.8 + progress * 0.2})`;
                likeStamp.style.opacity = 0;
            } else if (deltaX < -30) {
                const progress = Math.min(1, (-deltaX - 30) / 100);
                likeStamp.style.opacity = progress;
                likeStamp.style.transform = `rotate(15deg) scale(${0.8 + progress * 0.2})`;
                nopeStamp.style.opacity = 0;
            } else {
                likeStamp.style.opacity = 0;
                nopeStamp.style.opacity = 0;
            }
        }

        function onDragEnd() {
            if (!dragState.isDragging || !dragState.card) return;

            const deltaX = dragState.currentX - dragState.startX;
            const card = dragState.card;
            const threshold = 80;

            document.removeEventListener("mousemove", onDragMove);
            document.removeEventListener("mouseup", onDragEnd);

            card.classList.remove("dragging");

            if (deltaX > threshold) {
                card.style.transform = "";
                card.style.opacity = "";
                swipe("right");
            } else if (deltaX < -threshold) {
                card.style.transform = "";
                card.style.opacity = "";
                swipe("left");
            } else {
                card.style.transition = "transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s";
                card.style.transform = "";
                card.style.opacity = "";
                setTimeout(() => {
                    card.style.transition = "";
                }, 400);

                const likeStamp = card.querySelector(".card-stamp-like");
                const nopeStamp = card.querySelector(".card-stamp-nope");
                if (likeStamp) likeStamp.style.opacity = 0;
                if (nopeStamp) nopeStamp.style.opacity = 0;
            }

            dragState.isDragging = false;
            dragState.card = null;
        }

        function openLikesView() {
            document.getElementById("likesView").classList.add("active");
            loadLikes("incoming");
            switchLikesTab("incoming");
        }

        function closeLikesView() {
            document.getElementById("likesView").classList.remove("active");
        }

        function switchLikesTab(tab) {
            document.getElementById("tabIncoming").classList.toggle("active", tab === "incoming");
            document.getElementById("tabOutgoing").classList.toggle("active", tab === "outgoing");
            loadLikes(tab);
        }

        async function loadLikes(tab) {
            const content = document.getElementById("likesContent");
            content.innerHTML = '<div class="loading" style="padding: 60px 20px;">Загрузка...</div>';

            try {
                const endpoint = tab === "incoming" ? "/api/likes/incoming" : "/api/likes/outgoing";
                const res = await fetch(API_URL + endpoint + "?telegram_id=" + getTelegramId());
                const data = await res.json();

                if (tab === "incoming") {
                    document.getElementById("tabIncomingCount").innerText = data.length;
                } else {
                    document.getElementById("tabOutgoingCount").innerText = data.length;
                }

                if (!data || data.length === 0) {
                    content.innerHTML = `
                        <div class="empty" style="padding-top: 80px;">
                            <div class="empty-icon">${tab === "incoming" ? "💔" : "💜"}</div>
                            <div class="empty-title">${tab === "incoming" ? "Никто не лайкнул" : "Ты никого не лайкнул"}</div>
                            <div>${tab === "incoming" ? "Продолжай свайпать в ленте" : "Листай анкеты в ленте"}</div>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = data.map((u) => {
                    const cityPart = u.city ? ` · 📍 ${u.city}` : '';
                    if (tab === "incoming") {
                        return `
                            <div class="like-card">
                                <img src="${u.photo || 'images/girl.png'}" class="like-avatar" onerror="this.src='images/girl.png'">
                                <div class="like-info">
                                    <div class="like-name">${u.name}, ${u.age}</div>
                                    <div class="like-meta">${u.bio ? u.bio.slice(0, 40) + (u.bio.length > 40 ? '...' : '') : 'Хочет познакомиться'}${cityPart}</div>
                                </div>
                                <div class="like-actions">
                                    <button class="like-btn like-btn-reject" onclick="rejectIncoming('${u.telegram_id}', this)">
                                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
                                    </button>
                                    <button class="like-btn like-btn-accept" onclick="acceptIncoming('${u.telegram_id}', this)">
                                        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        const mutual = u.is_mutual ? '<span class="mutual-badge">💕 МЭТЧ</span>' : '';
                        return `
                            <div class="like-card">
                                <img src="${u.photo || 'images/girl.png'}" class="like-avatar" onerror="this.src='images/girl.png'">
                                <div class="like-info">
                                    <div class="like-name">${u.name}, ${u.age}${mutual}</div>
                                    <div class="like-meta">${u.bio ? u.bio.slice(0, 40) + (u.bio.length > 40 ? '...' : '') : 'Ты лайкнул эту анкету'}${cityPart}</div>
                                </div>
                                <div class="like-actions">
                                    <button class="like-btn like-btn-cancel" onclick="cancelOutgoing('${u.telegram_id}', this)" title="Отменить лайк">
                                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }).join("");
            } catch (e) {
                console.error("Ошибка загрузки лайков:", e);
                content.innerHTML = `
                    <div class="empty" style="padding-top: 80px;">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Не удалось загрузить</div>
                        <div>Проверь интернет</div>
                    </div>
                `;
            }
        }

        async function acceptIncoming(userId, btn) {
            if (navigator.vibrate) navigator.vibrate(30);
            btn.style.transform = "scale(0.9)";

            try {
                const res = await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId,
                        is_like: true
                    })
                });
                const result = await res.json();

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);

                if (result.isMatch) {
                    lastMatchedUser = result.matchedUser;
                    setTimeout(() => {
                        closeLikesView();
                        showMatch(result.matchedUser);
                    }, 400);
                }
            } catch (e) {
                console.error("Ошибка:", e);
                alert("Не удалось принять лайк");
            }
        }

        async function rejectIncoming(userId, btn) {
            if (navigator.vibrate) navigator.vibrate(10);
            btn.style.transform = "scale(0.9)";

            try {
                await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId,
                        is_like: false
                    })
                });

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(-100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        async function cancelOutgoing(userId, btn) {
            if (!confirm("Отменить лайк?")) return;
            if (navigator.vibrate) navigator.vibrate(10);
            btn.style.transform = "scale(0.9)";

            try {
                await fetch(API_URL + "/api/likes", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId
                    })
                });

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(-100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        let profileData = null;

        async function openProfile() {
            document.getElementById("profileOverlay").classList.add("active");
            await loadProfileData();
        }

        function closeProfile() {
            document.getElementById("profileOverlay").classList.remove("active");
        }

        async function loadProfileData() {
            try {
                const res = await fetch(API_URL + "/api/profile?telegram_id=" + getTelegramId());
                if (!res.ok) throw new Error("HTTP " + res.status);
                profileData = await res.json();

                document.getElementById("profileName").value = profileData.name || "";
                document.getElementById("profileNickname").value = profileData.nickname || "";
                document.getElementById("profileCity").value = profileData.city || "";
                document.getElementById("profileAge").value = profileData.age || "";
                document.getElementById("profileGender").value = profileData.gender || "male";
                document.getElementById("profileLookingFor").value = profileData.looking_for || "any";
                document.getElementById("profileBio").value = profileData.bio || "";
                document.getElementById("profileAvatarImg").src = profileData.photo || "images/girl.png";
                document.getElementById("headerAvatar").src = profileData.photo || "images/girl.png";

                document.getElementById("myLikes").innerText = profileData.likes_received || 0;
                document.getElementById("myDislikes").innerText = profileData.dislikes_received || 0;

                if (profileData.banner && profileData.banner.startsWith("data:image")) {
                    document.getElementById("profileBannerImg").src = profileData.banner;
                    document.getElementById("profileBannerImg").style.display = "block";
                    document.getElementById("bannerPlaceholder").style.display = "none";
                } else {
                    document.getElementById("profileBannerImg").style.display = "none";
                    document.getElementById("bannerPlaceholder").style.display = "flex";
                }
            } catch (e) {
                console.error("Ошибка загрузки профиля:", e);
                if (myProfile) {
                    document.getElementById("profileName").value = myProfile.name || "";
                    document.getElementById("profileAge").value = myProfile.age || "";
                    document.getElementById("profileAvatarImg").src = myProfile.photo || "images/girl.png";
                }
            }
        }

        function handleProfilePhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("Файл слишком большой (макс 5 МБ)");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById("profileAvatarImg").src = e.target.result;
                if (!profileData) profileData = {};
                profileData.photo = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleBannerPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("Файл слишком большой (макс 5 МБ)");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById("profileBannerImg");
                img.src = e.target.result;
                img.style.display = "block";
                document.getElementById("bannerPlaceholder").style.display = "none";
                if (!profileData) profileData = {};
                profileData.banner = e.target.result;
                if (navigator.vibrate) navigator.vibrate(10);
            };
            reader.readAsDataURL(file);
        }

        async function saveProfile() {
            const name = document.getElementById("profileName").value.trim();
            const age = parseInt(document.getElementById("profileAge").value);

            if (name.length < 2) {
                alert("Имя должно быть от 2 символов");
                return;
            }
            if (!age || age < 13) {
                alert("Минимальный возраст — 13 лет");
                return;
            }

            const data = {
                telegram_id: getTelegramId(),
                name: name,
                nickname: document.getElementById("profileNickname").value.trim() || null,
                city: document.getElementById("profileCity").value.trim() || null,
                age: age,
                gender: document.getElementById("profileGender").value,
                looking_for: document.getElementById("profileLookingFor").value,
                bio: document.getElementById("profileBio").value.trim() || null,
                photo: profileData?.photo || null,
                banner: profileData?.banner || null
            };

            try {
                const res = await fetch(API_URL + "/api/profile", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.ok) {
                    const localData = JSON.parse(localStorage.getItem("emberUser") || "{}");
                    localData.name = data.name;
                    localData.age = data.age;
                    localData.nickname = data.nickname;
                    localData.city = data.city;
                    localData.bio = data.bio;
                    if (data.photo) localData.photo = data.photo;
                    localStorage.setItem("emberUser", JSON.stringify(localData));

                    if (data.photo) {
                        document.getElementById("headerAvatar").src = data.photo;
                    }

                    if (navigator.vibrate) navigator.vibrate(30);

                    const btn = document.querySelector(".profile-save-btn");
                    const originalText = btn.innerText;
                    btn.innerText = "✅ Сохранено";
                    setTimeout(() => { btn.innerText = originalText; }, 1500);
                } else {
                    alert("Ошибка: " + (result.error || "не удалось сохранить"));
                }
            } catch (e) {
                console.error("Ошибка сохранения:", e);
                alert("Не удалось сохранить профиль");
            }
        }

        function logout() {
            if (confirm("Выйти из аккаунта? Анкета удалится из Ember.")) {
                localStorage.removeItem("emberUser");
                localStorage.removeItem("emberRegistered");
                localStorage.removeItem("emberTgId");
                window.location.href = "index.html";
            }
        }

        function openDeleteModal() {
            document.getElementById("deleteModal").classList.add("active");
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function closeDeleteModal() {
            document.getElementById("deleteModal").classList.remove("active");
        }

        async function confirmDeleteAccount() {
            const btn = document.querySelector(".delete-modal-btn-danger");
            btn.innerText = "⏳ Удаляем...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL + "/api/profile", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ telegram_id: getTelegramId() })
                });
                const result = await res.json();

                if (result.ok) {
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                    localStorage.removeItem("emberUser");
                    localStorage.removeItem("emberRegistered");
                    localStorage.removeItem("emberTgId");

                    btn.innerText = "✅ Удалено";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 800);
                } else {
                    alert("Ошибка: " + (result.error || "не удалось удалить"));
                    btn.innerText = "🗑️ Да, удалить навсегда";
                    btn.disabled = false;
                }
            } catch (e) {
                console.error("Ошибка удаления:", e);
                alert("Не удалось удалить аккаунт. Проверь интернет.");
                btn.innerText = "🗑️ Да, удалить навсегда";
                btn.disabled = false;
            }
        }

        document.getElementById("deleteModal")?.addEventListener("click", (e) => {
            if (e.target.id === "deleteModal") closeDeleteModal();
        });

        let isActive = true;
        document.addEventListener("visibilitychange", () => {
            isActive = !document.hidden;
            if (isActive) checkBadges();
        });

        async function checkBadges() {
            try {
                const res = await fetch(API_URL + "/api/likes/incoming?telegram_id=" + getTelegramId());
                const likesData = await res.json();
                const likesBadge = document.getElementById("likesBadge");
                if (likesData.length > 0) {
                    likesBadge.innerText = likesData.length > 99 ? "99+" : likesData.length;
                    likesBadge.classList.add("active");
                } else {
                    likesBadge.classList.remove("active");
                }
            } catch (e) {}

            try {
                const res = await fetch(API_URL + "/api/messages/unread?telegram_id=" + getTelegramId());
                const data = await res.json();
                const total = data.reduce((sum, item) => sum + parseInt(item.count), 0);
                const badge = document.getElementById("unreadBadge");
                if (total > 0) {
                    badge.innerText = total > 99 ? "99+" : total;
                    badge.classList.add("active");
                } else {
                    badge.classList.remove("active");
                }
            } catch (e) {}
        }

        loadProfiles();
        checkBadges();
        setInterval(() => {
            if (isActive) checkBadges();
        }, 20000);
    </script>
