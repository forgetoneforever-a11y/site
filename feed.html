<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0618">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Ember — Лента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 0; overflow: hidden;
            background: radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.15), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.12), transparent 50%),
                        #0a0618;
        }

        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles span {
            position: absolute; width: 4px; height: 4px; border-radius: 50%;
            background: rgba(217, 56, 94, 0.4);
            animation: floatParticle 15s infinite ease-in-out;
        }
        .bg-particles span:nth-child(1) { left: 10%; top: 20%; }
        .bg-particles span:nth-child(2) { left: 80%; top: 30%; animation-delay: 3s; background: rgba(123, 47, 255, 0.5); }
        .bg-particles span:nth-child(3) { left: 30%; top: 70%; animation-delay: 6s; }
        .bg-particles span:nth-child(4) { left: 70%; top: 80%; animation-delay: 9s; background: rgba(123, 47, 255, 0.5); }
        .bg-particles span:nth-child(5) { left: 50%; top: 15%; animation-delay: 12s; }

        @keyframes floatParticle {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(30px, -40px) scale(1.5); opacity: 0.8; }
        }

        .feed-header {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(10,6,24,0.98), rgba(10,6,24,0.5), transparent);
            z-index: 10; display: flex; align-items: center; justify-content: space-between;
        }

        .feed-title {
            font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .feed-menu {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(120, 100, 220, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .feed-menu:hover {
            transform: scale(1.1);
            background: rgba(45, 30, 85, 0.8);
            border-color: rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.4);
        }
        .feed-menu:active { transform: scale(0.95); }
        .feed-menu svg { width: 20px; height: 20px; stroke: #fff; transition: stroke 0.2s; }
        .feed-menu:hover svg { stroke: #ff5c8a; }

        /* Кнопка-аватарка */
        .profile-btn {
            padding: 0 !important;
            overflow: hidden;
            border: 2px solid rgba(217, 56, 94, 0.6) !important;
            box-shadow: 0 0 15px rgba(217, 56, 94, 0.4) !important;
        }
        .profile-btn img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%; display: block;
        }
        .profile-btn:hover {
            border-color: rgba(217, 56, 94, 1) !important;
            box-shadow: 0 0 25px rgba(217, 56, 94, 0.8) !important;
        }

        .unread-badge {
            position: absolute; top: -4px; right: -4px;
            background: linear-gradient(135deg, #d9385e, #a02040);
            color: #fff; border-radius: 50%; min-width: 20px; height: 20px;
            display: none; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; padding: 0 5px;
            box-shadow: 0 2px 8px rgba(217, 56, 94, 0.6);
            animation: badgePulse 2s ease-in-out infinite;
        }
        .unread-badge.active { display: flex; }
        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 2px 8px rgba(217, 56, 94, 0.6); }
            50% { box-shadow: 0 2px 20px rgba(217, 56, 94, 1), 0 0 30px rgba(217, 56, 94, 0.5); }
        }

        .cards-container {
            width: 100vw; height: 100vh;
            position: relative; overflow: hidden; z-index: 1;
        }

        .card {
            position: absolute;
            top: 70px; left: 20px; right: 20px; bottom: 100px;
            background: rgba(30, 20, 60, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 40px rgba(123, 47, 255, 0.2), inset 0 0 0 1px rgba(120, 100, 220, 0.2);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
            animation: cardEnter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes cardEnter {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 24px;
            background: linear-gradient(0deg, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent);
            color: #fff;
        }
        .card-name { font-size: 26px; font-weight: 700; margin-bottom: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .card-age { font-size: 22px; color: rgba(255,255,255,0.9); font-weight: 400; }
        .card-bio { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 8px; line-height: 1.4; }

        .actions {
            position: fixed; bottom: 24px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 24px; z-index: 10;
        }

        .action-btn {
            width: 68px; height: 68px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .action-btn svg { width: 28px; height: 28px; }
        .action-btn:hover { transform: translateY(-4px) scale(1.05); }
        .action-btn:active { transform: scale(0.92); }

        .btn-dislike {
            background: rgba(30, 20, 60, 0.8);
            backdrop-filter: blur(20px);
            color: #fff;
            border: 2px solid rgba(120, 100, 220, 0.4);
        }
        .btn-dislike:hover {
            border-color: rgba(120, 100, 220, 0.8);
            box-shadow: 0 8px 30px rgba(120, 100, 220, 0.4);
        }

        .btn-like {
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff;
            box-shadow: 0 8px 30px rgba(123, 47, 255, 0.6), 0 0 60px rgba(217, 56, 94, 0.4);
            position: relative; overflow: hidden;
        }
        .btn-like::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%); transition: transform 0.6s;
        }
        .btn-like:hover::before { transform: translateX(100%); }
        .btn-like:hover {
            box-shadow: 0 12px 40px rgba(123, 47, 255, 0.8), 0 0 80px rgba(217, 56, 94, 0.6);
        }

        .card.swipe-left { transform: translateX(-150%) rotate(-30deg); opacity: 0; }
        .card.swipe-right { transform: translateX(150%) rotate(30deg); opacity: 0; }

        .empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: #9a92c4; text-align: center;
            padding: 40px; font-size: 16px; gap: 16px;
            animation: fadeIn 0.5s;
        }
        .empty-icon { font-size: 70px; opacity: 0.5; animation: pulseSlow 2s ease-in-out infinite; }
        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .empty-title {
            font-size: 22px; color: #fff; font-weight: 700;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .loading {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: #9a92c4; font-size: 16px;
        }

        .match-overlay {
            position: fixed; inset: 0;
            background: rgba(10, 6, 24, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000; display: none;
            align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.4s;
        }
        .match-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .match-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.98), rgba(60, 30, 100, 0.95));
            border: 2px solid rgba(217, 56, 94, 0.5);
            border-radius: 32px; padding: 36px 28px;
            text-align: center; max-width: 360px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(217, 56, 94, 0.5), 0 0 120px rgba(123, 47, 255, 0.4);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: hidden;
        }
        .match-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(217, 56, 94, 0.3), rgba(123, 47, 255, 0.3), transparent);
            animation: rotateGlow 6s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .match-card > * { position: relative; z-index: 1; }
        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .match-emoji { font-size: 72px; margin-bottom: 16px; animation: heartBeat 1s ease-in-out infinite; filter: drop-shadow(0 0 20px rgba(217, 56, 94, 0.8)); }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }
        .match-title {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 8px; letter-spacing: -1px;
            animation: gradientShift 3s ease infinite;
        }
        .match-sub { font-size: 15px; color: #9a92c4; margin-bottom: 24px; }
        .match-photos { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; position: relative; }
        .match-photo {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            border: 3px solid #d9385e; box-shadow: 0 0 20px rgba(217, 56, 94, 0.6);
            transition: transform 0.3s;
        }
        .match-photo:nth-child(1) { transform: rotate(-5deg); animation: slideInLeft 0.6s 0.2s backwards; }
        .match-photo:nth-child(2) { transform: rotate(5deg); animation: slideInRight 0.6s 0.2s backwards; }
        @keyframes slideInLeft { from { transform: translateX(-100px) rotate(-20deg); opacity: 0; } to { transform: translateX(0) rotate(-5deg); opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100px) rotate(20deg); opacity: 0; } to { transform: translateX(0) rotate(5deg); opacity: 1; } }

        .match-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 20px; }
        .match-btn {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.3s;
        }
        .match-btn-primary {
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; box-shadow: 0 6px 25px rgba(123, 47, 255, 0.5);
            margin-bottom: 10px; position: relative; overflow: hidden;
        }
        .match-btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 35px rgba(123, 47, 255, 0.7); }
        .match-btn-secondary {
            background: transparent; color: #9a92c4;
            border: 1.5px solid rgba(120, 100, 220, 0.3);
        }
        .match-btn-secondary:hover { color: #fff; border-color: #d9385e; transform: translateY(-2px); }

        /* ═══ ПАНЕЛЬ ЛАЙКОВ ═══ */
        .likes-view {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.15), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.12), transparent 50%),
                        #0a0618;
            z-index: 2000; display: none;
            flex-direction: column;
            animation: fadeIn 0.3s;
        }
        .likes-view.active { display: flex; }

        .likes-header {
            padding: 14px 16px;
            background: linear-gradient(180deg, rgba(10,6,24,0.98), rgba(10,6,24,0.7), transparent);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; gap: 12px;
            min-height: 66px; flex-shrink: 0;
        }
        .likes-back {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(120, 100, 220, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: all 0.3s;
        }
        .likes-back:hover {
            transform: scale(1.1);
            background: rgba(45, 30, 85, 0.8);
            border-color: rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.4);
        }
        .likes-back svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .likes-title {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px; flex: 1;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: gradientShift 3s ease infinite;
        }

        .likes-tabs {
            display: flex; gap: 8px;
            padding: 0 16px 12px;
            flex-shrink: 0;
        }
        .likes-tab {
            flex: 1; padding: 12px 16px;
            border-radius: 14px;
            background: rgba(30, 20, 60, 0.6);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            color: #9a92c4; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.3s; text-align: center;
        }
        .likes-tab:hover {
            background: rgba(45, 30, 85, 0.7);
            border-color: rgba(217, 56, 94, 0.5);
        }
        .likes-tab.active {
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; border-color: transparent;
            box-shadow: 0 4px 20px rgba(123, 47, 255, 0.5);
        }
        .likes-tab-count {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border-radius: 10px; padding: 1px 8px;
            font-size: 12px; margin-left: 4px;
        }
        .likes-tab.active .likes-tab-count {
            background: rgba(255,255,255,0.3);
        }

        .likes-content {
            flex: 1; overflow-y: auto;
            padding: 0 16px 20px;
        }
        .likes-content::-webkit-scrollbar { width: 4px; }
        .likes-content::-webkit-scrollbar-thumb { background: rgba(120, 100, 220, 0.3); border-radius: 4px; }

        .like-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; margin-bottom: 12px;
            border: 1.5px solid rgba(120, 100, 220, 0.35);
            border-radius: 20px;
            background: rgba(30, 20, 60, 0.5);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: itemEnter 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }
        @keyframes itemEnter {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .like-avatar {
            width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
            border: 2.5px solid rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 0 3px rgba(217, 56, 94, 0.15), 0 0 20px rgba(217, 56, 94, 0.5);
            flex-shrink: 0;
        }

        .like-info { flex: 1; min-width: 0; }
        .like-name {
            font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .like-meta {
            font-size: 13px; color: #9a92c4;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .like-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .like-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .like-btn svg { width: 20px; height: 20px; stroke-width: 2.5; fill: none; }

        .like-btn-accept {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.5);
        }
        .like-btn-accept:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.8);
        }
        .like-btn-accept svg { stroke: #fff; }

        .like-btn-reject {
            background: rgba(30, 20, 60, 0.7);
            color: #ff5c8a;
            border: 1.5px solid rgba(217, 56, 94, 0.5);
        }
        .like-btn-reject:hover {
            transform: scale(1.1);
            background: rgba(217, 56, 94, 0.2);
            border-color: #d9385e;
            box-shadow: 0 6px 25px rgba(217, 56, 94, 0.5);
        }
        .like-btn-reject svg { stroke: #ff5c8a; }

        .like-btn-cancel {
            background: rgba(217, 56, 94, 0.15);
            color: #ff5c8a;
            border: 1.5px solid rgba(217, 56, 94, 0.5);
        }
        .like-btn-cancel:hover {
            transform: scale(1.1);
            background: rgba(217, 56, 94, 0.3);
            box-shadow: 0 6px 25px rgba(217, 56, 94, 0.5);
        }
        .like-btn-cancel svg { stroke: #ff5c8a; }

        .mutual-badge {
            display: inline-block;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; font-size: 10px; font-weight: 700;
            padding: 2px 8px; border-radius: 8px;
            margin-left: 6px; vertical-align: middle;
        }

        /* ═══ ПРОФИЛЬ ═══ */
        .profile-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(123, 47, 255, 0.15), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(217, 56, 94, 0.12), transparent 50%),
                        #0a0618;
            z-index: 2000; display: none;
            flex-direction: column;
            animation: fadeIn 0.3s;
            overflow-y: auto;
        }
        .profile-overlay.active { display: flex; }

        .profile-header-bar {
            padding: 14px 16px;
            background: linear-gradient(180deg, rgba(10,6,24,0.98), rgba(10,6,24,0.7), transparent);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; gap: 12px;
            min-height: 66px; flex-shrink: 0;
            position: sticky; top: 0; z-index: 10;
        }

        .profile-back-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(30, 20, 60, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(120, 100, 220, 0.3);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; flex-shrink: 0;
            transition: all 0.3s;
        }
        .profile-back-btn:hover {
            transform: scale(1.1);
            background: rgba(45, 30, 85, 0.8);
            border-color: rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.4);
        }
        .profile-back-btn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .profile-title-bar {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff5c8a, #7b2fff, #a855f7);
            background-size: 200% 200%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: gradientShift 3s ease infinite;
        }

        .profile-content {
            padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
            max-width: 500px; margin: 0 auto; width: 100%;
        }

        .profile-avatar-section {
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
        }

        .profile-avatar-wrapper {
            position: relative; width: 140px; height: 140px;
        }

        .profile-avatar-img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(217, 56, 94, 0.6);
            box-shadow: 0 0 0 6px rgba(217, 56, 94, 0.15), 0 0 30px rgba(217, 56, 94, 0.5), 0 0 60px rgba(123, 47, 255, 0.3);
        }

        .profile-avatar-edit {
            position: absolute; bottom: 4px; right: 4px;
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            border: 3px solid #0a0618;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(123, 47, 255, 0.6);
            transition: all 0.3s;
        }
        .profile-avatar-edit:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 6px 25px rgba(123, 47, 255, 0.9);
        }
        .profile-avatar-edit svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.5; fill: none; }

        .profile-field {
            display: flex; flex-direction: column; gap: 6px;
        }
        .profile-field label {
            font-size: 11px; color: #9a92c4;
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 600; padding-left: 4px;
        }
        .profile-field input,
        .profile-field textarea {
            width: 100%;
            background: rgba(30, 20, 60, 0.55);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff; font-size: 15px;
            font-family: inherit; outline: none;
            transition: all 0.3s; resize: vertical;
        }
        .profile-field input:focus,
        .profile-field textarea:focus {
            border-color: #d9385e;
            background: rgba(45, 30, 85, 0.7);
            box-shadow: 0 0 0 4px rgba(217, 56, 94, 0.15), 0 0 25px rgba(123, 47, 255, 0.3);
        }
        .profile-field textarea { min-height: 100px; }

        .profile-select {
            width: 100%;
            background: rgba(30, 20, 60, 0.55);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff; font-size: 15px;
            font-family: inherit; outline: none;
            cursor: pointer;
            transition: all 0.3s;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%239a92c4%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M6%209l6%206%206-6%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 45px;
        }
        .profile-select:focus {
            border-color: #d9385e;
            box-shadow: 0 0 0 4px rgba(217, 56, 94, 0.15), 0 0 25px rgba(123, 47, 255, 0.3);
        }
        .profile-select option {
            background: #1a1030; color: #fff;
        }

        .profile-save-btn {
            width: 100%; padding: 16px; border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #7b2fff, #d9385e);
            color: #fff; font-size: 16px; font-weight: 700;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 6px 25px rgba(123, 47, 255, 0.5);
            transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .profile-save-btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%); transition: transform 0.6s;
        }
        .profile-save-btn:hover::before { transform: translateX(100%); }
        .profile-save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(123, 47, 255, 0.7);
        }
        .profile-save-btn:active { transform: scale(0.98); }

        .profile-logout-btn {
            width: 100%; padding: 14px;
            border: 1.5px solid rgba(217, 56, 94, 0.4);
            border-radius: 14px;
            background: rgba(217, 56, 94, 0.1);
            color: #ff5c8a; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all 0.3s;
        }
        .profile-logout-btn:hover {
            background: rgba(217, 56, 94, 0.2);
            border-color: #d9385e;
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.4);
        }

        .profile-photo-input { display: none; }
    </style>
</head>
<body>

    <div class="bg-particles">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="feed-header">
        <div class="feed-title">Лента</div>
        <div style="display:flex; gap:10px; position:relative;">
            <div class="feed-menu" onclick="openLikesView()" title="Лайки">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <div class="unread-badge" id="likesBadge">0</div>
            </div>
            <div class="feed-menu" onclick="window.location.href='chats.html'" title="Чаты">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <div class="unread-badge" id="unreadBadge">0</div>
            </div>
            <div class="feed-menu profile-btn" onclick="openProfile()" title="Профиль">
                <img id="headerAvatar" src="images/girl.png" alt="Profile">
            </div>
        </div>
    </div>

    <div class="cards-container" id="cards">
        <div class="loading">Загрузка анкет...</div>
    </div>

    <div class="actions" id="actions" style="display:none;">
        <button class="action-btn btn-dislike" onclick="swipe('left')">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <button class="action-btn btn-like" onclick="swipe('right')">
            <svg viewBox="0 0 24 24" fill="#fff" stroke="none">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </button>
    </div>

    <div class="match-overlay" id="matchOverlay">
        <div class="match-card">
            <div class="match-emoji">💕</div>
            <div class="match-title">Это мэтч!</div>
            <div class="match-sub">Вы понравились друг другу</div>
            <div class="match-photos">
                <img id="matchPhotoMe" class="match-photo" src="images/girl.png" alt="me">
                <img id="matchPhotoYou" class="match-photo" src="images/girl.png" alt="you">
            </div>
            <div class="match-name" id="matchName"></div>
            <button class="match-btn match-btn-primary" onclick="goToChats()">💬 Написать сообщение</button>
            <button class="match-btn match-btn-secondary" onclick="closeMatch()">Продолжить смотреть</button>
        </div>
    </div>

    <!-- ═══ ПАНЕЛЬ ЛАЙКОВ ═══ -->
    <div class="likes-view" id="likesView">
        <div class="likes-header">
            <div class="likes-back" onclick="closeLikesView()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <div class="likes-title">❤️ Лайки</div>
        </div>

        <div class="likes-tabs">
            <button class="likes-tab active" onclick="switchLikesTab('incoming')" id="tabIncoming">
                Меня лайкнули<span class="likes-tab-count" id="tabIncomingCount">0</span>
            </button>
            <button class="likes-tab" onclick="switchLikesTab('outgoing')" id="tabOutgoing">
                Я лайкнул<span class="likes-tab-count" id="tabOutgoingCount">0</span>
            </button>
        </div>

        <div class="likes-content" id="likesContent">
            <div class="loading" style="padding: 60px 20px;">Загрузка...</div>
        </div>
    </div>

    <!-- ═══ ПРОФИЛЬ ═══ -->
    <div class="profile-overlay" id="profileOverlay">
        <div class="profile-header-bar">
            <div class="profile-back-btn" onclick="closeProfile()">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </div>
            <div class="profile-title-bar">👤 Профиль</div>
        </div>

        <div class="profile-content">
            <div class="profile-avatar-section">
                <div class="profile-avatar-wrapper">
                    <img id="profileAvatarImg" class="profile-avatar-img" src="images/girl.png" alt="Аватар">
                    <div class="profile-avatar-edit" onclick="document.getElementById('profilePhotoInput').click()">
                        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </div>
                </div>
                <input type="file" id="profilePhotoInput" class="profile-photo-input" accept="image/*" onchange="handleProfilePhoto(event)">
            </div>

            <div class="profile-field">
                <label>Имя</label>
                <input type="text" id="profileName" placeholder="Твоё имя" maxlength="32">
            </div>

            <div class="profile-field">
                <label>Никнейм</label>
                <input type="text" id="profileNickname" placeholder="@username">
            </div>

            <div class="profile-field">
                <label>Возраст</label>
                <input type="number" id="profileAge" placeholder="18" min="13" max="99">
            </div>

            <div class="profile-field">
                <label>Пол</label>
                <select id="profileGender" class="profile-select">
                    <option value="male">Парень</option>
                    <option value="female">Девушка</option>
                </select>
            </div>

            <div class="profile-field">
                <label>Кого ищу</label>
                <select id="profileLookingFor" class="profile-select">
                    <option value="male">Парней</option>
                    <option value="female">Девушек</option>
                    <option value="any">Без разницы</option>
                </select>
            </div>

            <div class="profile-field">
                <label>О себе</label>
                <textarea id="profileBio" placeholder="Расскажи о себе..." maxlength="500"></textarea>
            </div>

            <button class="profile-save-btn" onclick="saveProfile()">💾 Сохранить</button>
            <button class="profile-logout-btn" onclick="logout()">🚪 Выйти из аккаунта</button>
        </div>
    </div>

    <script>
        const API_URL = "https://backend-2tcl.onrender.com";

        let profiles = [];
        let currentIndex = 0;
        let myProfile = null;
        let lastMatchedUser = null;

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) return String(user.id);
            }
            let id = localStorage.getItem("emberTgId");
            if (!id) {
                id = "test_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("emberTgId", id);
            }
            return id;
        }

        function checkAuth() {
            try {
                const saved = localStorage.getItem("emberUser");
                if (!saved) { window.location.href = "index.html"; return null; }
                myProfile = JSON.parse(saved);
                if (myProfile.photo) {
                    document.getElementById("headerAvatar").src = myProfile.photo;
                }
                return myProfile;
            } catch (e) {
                window.location.href = "index.html";
                return null;
            }
        }

        async function loadProfiles() {
            const user = checkAuth();
            if (!user) return;

            try {
                const params = new URLSearchParams({
                    telegram_id: getTelegramId(),
                    looking_for: user.lookingFor || "any",
                    min_age: user.minAge || 13,
                    max_age: user.maxAge || 99
                });
                const res = await fetch(API_URL + "/api/recommendations?" + params.toString());
                if (!res.ok) throw new Error("HTTP " + res.status);
                profiles = await res.json();
                renderCard();
            } catch (e) {
                console.error("❌ Ошибка загрузки:", e);
                document.getElementById("cards").innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Не удалось загрузить</div>
                        <div>Проверь интернет или попробуй позже</div>
                    </div>
                `;
            }
        }

        function renderCard() {
            const container = document.getElementById("cards");
            container.innerHTML = "";

            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔥</div>
                        <div class="empty-title">Пока никого нет</div>
                        <div>Заходи позже — появятся новые</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            document.getElementById("actions").style.display = "flex";

            if (currentIndex >= profiles.length) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">✨</div>
                        <div class="empty-title">Анкеты закончились</div>
                        <div>Заходи позже</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            const profile = profiles[currentIndex];
            const card = document.createElement("div");
            card.className = "card";
            const photoSrc = profile.photo || "images/girl.png";
            card.innerHTML = `
                <img src="${photoSrc}" alt="${profile.name}" onerror="this.src='images/girl.png'">
                <div class="card-info">
                    <div class="card-name">${profile.name}, <span class="card-age">${profile.age}</span></div>
                    <div class="card-bio">${profile.bio || ''}</div>
                </div>
            `;
            container.appendChild(card);
        }

        async function swipe(direction) {
            const card = document.querySelector(".card");
            if (!card) return;

            if (navigator.vibrate) navigator.vibrate(20);
            card.classList.add(direction === "left" ? "swipe-left" : "swipe-right");

            const profile = profiles[currentIndex];
            const isLike = direction === "right";

            try {
                const response = await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: profile.telegram_id,
                        is_like: isLike
                    })
                });
                const result = await response.json();

                if (result.isMatch && isLike) {
                    lastMatchedUser = result.matchedUser;
                    setTimeout(() => showMatch(result.matchedUser), 400);
                }
            } catch (e) {
                console.error("❌ Ошибка лайка:", e);
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 400);
        }

        function showMatch(matchedUser) {
            document.getElementById("matchName").innerText = matchedUser.name + ", " + matchedUser.age;
            document.getElementById("matchPhotoYou").src = matchedUser.photo || "images/girl.png";
            document.getElementById("matchPhotoMe").src = myProfile.photo || "images/girl.png";

            document.getElementById("matchOverlay").classList.add("active");
            if (navigator.vibrate) navigator.vibrate([50, 100, 50, 100, 50]);
        }

        function closeMatch() {
            document.getElementById("matchOverlay").classList.remove("active");
        }

        function goToChats() {
            closeMatch();
            if (!lastMatchedUser) {
                window.location.href = "chats.html";
                return;
            }
            window.location.href = "chats.html?open=" + lastMatchedUser.telegram_id;
        }

        // ═══ ПАНЕЛЬ ЛАЙКОВ ═══
        function openLikesView() {
            document.getElementById("likesView").classList.add("active");
            loadLikes("incoming");
            switchLikesTab("incoming");
        }

        function closeLikesView() {
            document.getElementById("likesView").classList.remove("active");
        }

        function switchLikesTab(tab) {
            document.getElementById("tabIncoming").classList.toggle("active", tab === "incoming");
            document.getElementById("tabOutgoing").classList.toggle("active", tab === "outgoing");
            loadLikes(tab);
        }

        async function loadLikes(tab) {
            const content = document.getElementById("likesContent");
            content.innerHTML = '<div class="loading" style="padding: 60px 20px;">Загрузка...</div>';

            try {
                const endpoint = tab === "incoming" ? "/api/likes/incoming" : "/api/likes/outgoing";
                const res = await fetch(API_URL + endpoint + "?telegram_id=" + getTelegramId());
                const data = await res.json();

                if (tab === "incoming") {
                    document.getElementById("tabIncomingCount").innerText = data.length;
                } else {
                    document.getElementById("tabOutgoingCount").innerText = data.length;
                }

                if (!data || data.length === 0) {
                    content.innerHTML = `
                        <div class="empty" style="padding-top: 80px;">
                            <div class="empty-icon">${tab === "incoming" ? "💔" : "💜"}</div>
                            <div class="empty-title">${tab === "incoming" ? "Никто не лайкнул" : "Ты никого не лайкнул"}</div>
                            <div>${tab === "incoming" ? "Продолжай свайпать в ленте" : "Листай анкеты в ленте"}</div>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = data.map((u, idx) => {
                    if (tab === "incoming") {
                        return `
                            <div class="like-card" style="animation-delay: ${idx * 0.05}s;">
                                <img src="${u.photo || 'images/girl.png'}" class="like-avatar" onerror="this.src='images/girl.png'">
                                <div class="like-info">
                                    <div class="like-name">${u.name}, ${u.age}</div>
                                    <div class="like-meta">${u.bio ? u.bio.slice(0, 40) + (u.bio.length > 40 ? '...' : '') : 'Хочет познакомиться'}</div>
                                </div>
                                <div class="like-actions">
                                    <button class="like-btn like-btn-reject" onclick="rejectIncoming('${u.telegram_id}', this)">
                                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
                                    </button>
                                    <button class="like-btn like-btn-accept" onclick="acceptIncoming('${u.telegram_id}', this)">
                                        <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        const mutual = u.is_mutual ? '<span class="mutual-badge">💕 МЭТЧ</span>' : '';
                        return `
                            <div class="like-card" style="animation-delay: ${idx * 0.05}s;">
                                <img src="${u.photo || 'images/girl.png'}" class="like-avatar" onerror="this.src='images/girl.png'">
                                <div class="like-info">
                                    <div class="like-name">${u.name}, ${u.age}${mutual}</div>
                                    <div class="like-meta">${u.bio ? u.bio.slice(0, 40) + (u.bio.length > 40 ? '...' : '') : 'Ты лайкнул эту анкету'}</div>
                                </div>
                                <div class="like-actions">
                                    <button class="like-btn like-btn-cancel" onclick="cancelOutgoing('${u.telegram_id}', this)" title="Отменить лайк">
                                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }).join("");
            } catch (e) {
                console.error("Ошибка загрузки лайков:", e);
                content.innerHTML = `
                    <div class="empty" style="padding-top: 80px;">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Не удалось загрузить</div>
                        <div>Проверь интернет</div>
                    </div>
                `;
            }
        }

        async function acceptIncoming(userId, btn) {
            if (navigator.vibrate) navigator.vibrate(30);
            btn.style.transform = "scale(0.9)";

            try {
                const res = await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId,
                        is_like: true
                    })
                });
                const result = await res.json();

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);

                if (result.isMatch) {
                    lastMatchedUser = result.matchedUser;
                    setTimeout(() => {
                        closeLikesView();
                        showMatch(result.matchedUser);
                    }, 400);
                }
            } catch (e) {
                console.error("Ошибка:", e);
                alert("Не удалось принять лайк");
            }
        }

        async function rejectIncoming(userId, btn) {
            if (navigator.vibrate) navigator.vibrate(10);
            btn.style.transform = "scale(0.9)";

            try {
                await fetch(API_URL + "/api/likes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId,
                        is_like: false
                    })
                });

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(-100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        async function cancelOutgoing(userId, btn) {
            if (!confirm("Отменить лайк?")) return;
            if (navigator.vibrate) navigator.vibrate(10);
            btn.style.transform = "scale(0.9)";

            try {
                await fetch(API_URL + "/api/likes", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        from_user: getTelegramId(),
                        to_user: userId
                    })
                });

                btn.closest(".like-card").style.opacity = "0";
                btn.closest(".like-card").style.transform = "translateX(-100px)";
                setTimeout(() => btn.closest(".like-card").remove(), 300);
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        // ═══ ПРОФИЛЬ ═══
        let profileData = null;

        async function openProfile() {
            document.getElementById("profileOverlay").classList.add("active");
            await loadProfileData();
        }

        function closeProfile() {
            document.getElementById("profileOverlay").classList.remove("active");
        }

        async function loadProfileData() {
            try {
                const res = await fetch(API_URL + "/api/profile?telegram_id=" + getTelegramId());
                if (!res.ok) throw new Error("HTTP " + res.status);
                profileData = await res.json();

                document.getElementById("profileName").value = profileData.name || "";
                document.getElementById("profileNickname").value = profileData.nickname || "";
                document.getElementById("profileAge").value = profileData.age || "";
                document.getElementById("profileGender").value = profileData.gender || "male";
                document.getElementById("profileLookingFor").value = profileData.looking_for || "any";
                document.getElementById("profileBio").value = profileData.bio || "";
                document.getElementById("profileAvatarImg").src = profileData.photo || "images/girl.png";
                document.getElementById("headerAvatar").src = profileData.photo || "images/girl.png";
            } catch (e) {
                console.error("Ошибка загрузки профиля:", e);
                if (myProfile) {
                    document.getElementById("profileName").value = myProfile.name || "";
                    document.getElementById("profileAge").value = myProfile.age || "";
                    document.getElementById("profileAvatarImg").src = myProfile.photo || "images/girl.png";
                }
            }
        }

        function handleProfilePhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("Файл слишком большой (макс 5 МБ)");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById("profileAvatarImg").src = e.target.result;
                if (!profileData) profileData = {};
                profileData.photo = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function saveProfile() {
            const name = document.getElementById("profileName").value.trim();
            const age = parseInt(document.getElementById("profileAge").value);

            if (name.length < 2) {
                alert("Имя должно быть от 2 символов");
                return;
            }
            if (!age || age < 13) {
                alert("Минимальный возраст — 13 лет");
                return;
            }

            const data = {
                telegram_id: getTelegramId(),
                name: name,
                nickname: document.getElementById("profileNickname").value.trim() || null,
                age: age,
                gender: document.getElementById("profileGender").value,
                looking_for: document.getElementById("profileLookingFor").value,
                bio: document.getElementById("profileBio").value.trim() || null,
                photo: profileData?.photo || null
            };

            try {
                const res = await fetch(API_URL + "/api/profile", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.ok) {
                    const localData = JSON.parse(localStorage.getItem("emberUser") || "{}");
                    localData.name = data.name;
                    localData.age = data.age;
                    localData.nickname = data.nickname;
                    localData.bio = data.bio;
                    if (data.photo) localData.photo = data.photo;
                    localStorage.setItem("emberUser", JSON.stringify(localData));

                    if (data.photo) {
                        document.getElementById("headerAvatar").src = data.photo;
                    }

                    if (navigator.vibrate) navigator.vibrate(30);

                    const btn = document.querySelector(".profile-save-btn");
                    const originalText = btn.innerText;
                    btn.innerText = "✅ Сохранено";
                    setTimeout(() => { btn.innerText = originalText; }, 1500);
                } else {
                    alert("Ошибка: " + (result.error || "не удалось сохранить"));
                }
            } catch (e) {
                console.error("Ошибка сохранения:", e);
                alert("Не удалось сохранить профиль");
            }
        }

        function logout() {
            if (confirm("Выйти из аккаунта? Анкета удалится из Ember.")) {
                localStorage.removeItem("emberUser");
                localStorage.removeItem("emberRegistered");
                localStorage.removeItem("emberTgId");
                window.location.href = "index.html";
            }
        }

        // Бейджи
        async function checkLikesBadge() {
            try {
                const res = await fetch(API_URL + "/api/likes/incoming?telegram_id=" + getTelegramId());
                const data = await res.json();
                const badge = document.getElementById("likesBadge");
                if (data.length > 0) {
                    badge.innerText = data.length > 99 ? "99+" : data.length;
                    badge.classList.add("active");
                } else {
                    badge.classList.remove("active");
                }
            } catch (e) {}
        }

        async function checkUnread() {
            try {
                const res = await fetch(API_URL + "/api/messages/unread?telegram_id=" + getTelegramId());
                const data = await res.json();
                const total = data.reduce((sum, item) => sum + parseInt(item.count), 0);
                const badge = document.getElementById("unreadBadge");
                if (total > 0) {
                    badge.innerText = total > 99 ? "99+" : total;
                    badge.classList.add("active");
                } else {
                    badge.classList.remove("active");
                }
            } catch (e) {}
        }

        function openMenu() {
            if (confirm("Сбросить аккаунт и выйти?")) {
                localStorage.removeItem("emberUser");
                localStorage.removeItem("emberRegistered");
                window.location.href = "index.html";
            }
        }

        let startX = 0;
        document.addEventListener("touchstart", e => startX = e.touches[0].clientX);
        document.addEventListener("touchend", e => {
            if (document.getElementById("likesView").classList.contains("active")) return;
            if (document.getElementById("profileOverlay").classList.contains("active")) return;
            const diff = e.changedTouches[0].clientX - startX;
            if (diff > 80) swipe("right");
            if (diff < -80) swipe("left");
        });

        loadProfiles();
        checkUnread();
        checkLikesBadge();
        setInterval(checkUnread, 10000);
        setInterval(checkLikesBadge, 15000);
    </script>
</body>
