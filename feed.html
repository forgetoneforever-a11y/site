<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0618">
    <title>Ember — Лента</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 0; overflow: hidden; }

        .feed-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(10,6,24,0.95), transparent);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .feed-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-light), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .feed-menu {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(30, 20, 60, 0.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(120, 100, 220, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #fff;
            transition: all 0.2s;
        }
        .feed-menu:hover { transform: scale(1.1); }

        .cards-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .card {
            position: absolute;
            top: 70px; left: 20px; right: 20px; bottom: 100px;
            background: rgba(30, 20, 60, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 40px rgba(123, 47, 255, 0.2);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 24px;
            background: linear-gradient(0deg, rgba(0,0,0,0.95), transparent);
            color: #fff;
        }

        .card-name { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        .card-age { font-size: 22px; color: rgba(255,255,255,0.9); font-weight: 400; }
        .card-bio { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 8px; line-height: 1.4; }

        .actions {
            position: fixed;
            bottom: 20px; left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }

        .action-btn {
            width: 64px; height: 64px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .action-btn:hover { transform: scale(1.1); }
        .action-btn:active { transform: scale(0.95); }

        .btn-dislike {
            background: rgba(30, 20, 60, 0.7);
            backdrop-filter: blur(20px);
            color: #fff;
            border: 2px solid rgba(120, 100, 220, 0.4);
        }

        .btn-like {
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: #fff;
            box-shadow: 0 6px 25px rgba(123, 47, 255, 0.6), 0 0 40px rgba(217, 56, 94, 0.4);
        }

        .card.swipe-left { transform: translateX(-150%) rotate(-30deg); opacity: 0; }
        .card.swipe-right { transform: translateX(150%) rotate(30deg); opacity: 0; }

        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            text-align: center;
            padding: 40px;
            font-size: 16px;
            gap: 16px;
        }
        .empty-icon { font-size: 60px; opacity: 0.4; }
        .empty-title { font-size: 20px; color: #fff; font-weight: 600; }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            font-size: 16px;
        }

        .match-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 6, 24, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.4s;
        }
        .match-overlay.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .match-card {
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.95), rgba(60, 30, 100, 0.9));
            border: 2px solid rgba(217, 56, 94, 0.5);
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.6),
                0 0 60px rgba(217, 56, 94, 0.4),
                0 0 100px rgba(123, 47, 255, 0.3);
            animation: popIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .match-emoji {
            font-size: 64px;
            margin-bottom: 12px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .match-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-light), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .match-sub {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .match-photos {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .match-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px rgba(217, 56, 94, 0.6);
        }

        .match-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
        }

        .match-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .match-btn-primary {
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: #fff;
            box-shadow: 0 4px 20px rgba(123, 47, 255, 0.5);
            margin-bottom: 10px;
        }

        .match-btn-primary:hover { transform: translateY(-2px); }

        .match-btn-secondary {
            background: transparent;
            color: var(--muted);
            border: 1.5px solid rgba(120, 100, 220, 0.3);
        }

        .match-btn-secondary:hover { color: #fff; border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="feed-header">
        <div class="feed-title">Лента</div>
        <div class="feed-menu" onclick="openMenu()">⋮</div>
    </div>

    <div class="cards-container" id="cards">
        <div class="loading">Загрузка анкет...</div>
    </div>

    <div class="actions" id="actions" style="display:none;">
        <button class="action-btn btn-dislike" onclick="swipe('left')">✕</button>
        <button class="action-btn btn-like" onclick="swipe('right')">♥</button>
    </div>

    <div class="match-overlay" id="matchOverlay">
        <div class="match-card">
            <div class="match-emoji">💕</div>
            <div class="match-title">Это мэтч!</div>
            <div class="match-sub">Вы понравились друг другу</div>
            <div class="match-photos">
                <img id="matchPhotoMe" class="match-photo" src="images/girl.png" alt="me">
                <img id="matchPhotoYou" class="match-photo" src="images/girl.png" alt="you">
            </div>
            <div class="match-name" id="matchName"></div>
            <button class="match-btn match-btn-primary" onclick="goToChats()">💬 Написать сообщение</button>
            <button class="match-btn match-btn-secondary" onclick="closeMatch()">Продолжить смотреть</button>
        </div>
    </div>

    <script>
        const API_URL = "https://backend-2tcl.onrender.com";
        const BOT_USERNAME = "Emberanon_bot";

        let profiles = [];
        let currentIndex = 0;
        let myProfile = null;
        let lastMatchedUser = null;

        function getTelegramId() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const user = window.Telegram.WebApp.initDataUnsafe.user;
                if (user) return String(user.id);
            }
            let id = localStorage.getItem("emberTgId");
            if (!id) {
                id = "test_" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("emberTgId", id);
            }
            return id;
        }

        function checkAuth() {
            try {
                const saved = localStorage.getItem("emberUser");
                if (!saved) { window.location.href = "index.html"; return null; }
                myProfile = JSON.parse(saved);
                console.log("👤 Профиль:", myProfile);
                return myProfile;
            } catch (e) {
                window.location.href = "index.html";
                return null;
            }
        }

        async function loadProfiles() {
            const user = checkAuth();
            if (!user) return;

            try {
                const params = new URLSearchParams({
                    telegram_id: getTelegramId(),
                    looking_for: user.lookingFor || "any",
                    min_age: user.minAge || 18,
                    max_age: user.maxAge || 99
                });
                const res = await fetch(API_URL + "/api/recommendations?" + params.toString());
                if (!res.ok) throw new Error("HTTP " + res.status);
                profiles = await res.json();
                console.log("📥 Загружено анкет:", profiles.length);
                renderCard();
            } catch (e) {
                console.error("❌ Ошибка загрузки:", e);
                document.getElementById("cards").innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <div class="empty-title">Не удалось загрузить</div>
                        <div>Проверь интернет или попробуй позже</div>
                    </div>
                `;
            }
        }

        function renderCard() {
            const container = document.getElementById("cards");
            container.innerHTML = "";

            if (profiles.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔥</div>
                        <div class="empty-title">Пока никого нет</div>
                        <div>Заходи позже — появятся новые</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            document.getElementById("actions").style.display = "flex";

            if (currentIndex >= profiles.length) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">✨</div>
                        <div class="empty-title">Анкеты закончились</div>
                        <div>Заходи позже</div>
                    </div>
                `;
                document.getElementById("actions").style.display = "none";
                return;
            }

            const profile = profiles[currentIndex];
            const card
